<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biography of the Bubbles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#08070c;
  --void-2:#0d0c14;
  --panel:#121119;
  --line:#242233;
  --line-soft:#1a1826;
  --ink:#e9e6f2;
  --ink-dim:#a29dbd;
  --ink-faint:#6b6784;

  --amber:#e0a94e;
  --amber-dim:#8a6e3a;
  --amber-glow:rgba(224,169,78,.12);

  --turq:#5ec9c9;
  --turq-dim:#3c7f7f;
  --turq-glow:rgba(94,201,201,.12);

  /* Deliberately not the same hex as --amber: a sublime-register outline on a 1999 (amber-
     filled) node needs to read as a distinct ring, not blend into the fill it surrounds. */
  --sublime:#ffe08a;
  --demonic:#c9556b;
  --paired:#9b7fd4;
  --deflated:#5f6a7a;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
/* Scroll-snap lives on .spine-scroll (below), NOT on html/body. It was
   originally on html — the same container the whole page scrolls in — and
   mandatory snapping there kept trapping the reader wherever the LAST snap
   point in the document happened to be: once free-scrolling content (first
   Diptych's overflow, then the Metaphors section) followed that point with
   nothing snap-aligned after it, scrolling into that content got yanked
   straight back. Adding another snap target further down just moved the
   trap, it didn't remove it — mandatory snapping in a single shared
   container can never coexist with free-scroll content after it. Switching
   to proximity avoided the trap but softened the snap everywhere, including
   the prologue→Chapter 1 handoff, which is what actually needs to feel crisp.
   Scoping mandatory snap to its own bounded, one-viewport-tall
   .spine-scroll container (prologue + all 8 chapters) fixes both: crisp
   snapping throughout that region, and once the reader scrolls past its
   last chapter they've simply reached the end of that container's own
   scrollable content — the outer page just continues normally into
   Metaphors, no next snap target required, no way to get trapped. */
body{
  margin:0;
  background:var(--void);
  color:var(--ink);
  font-family:'Newsreader',Georgia,serif;
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--paired);color:#08070c;}

.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
a{color:inherit;}

/* prefers-reduced-motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}

/* ---------- top nav ---------- */
#topnav{
  position:sticky;top:0;z-index:500;
  display:flex;align-items:center;justify-content:space-between;
  padding:.7rem 1.2rem;
  background:rgba(8,7,12,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;
  font-size:.72rem;
  letter-spacing:.04em;
}
#topnav .brand{color:var(--ink);text-transform:uppercase;font-weight:600;letter-spacing:.1em;}
#topnav .brand span{color:var(--ink-faint);font-weight:400;}
#topnav nav{display:flex;gap:1.1rem;flex-wrap:wrap;}
#topnav nav button{
  background:none;border:none;color:var(--ink-dim);cursor:pointer;
  font-family:inherit;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;
  padding:.3rem 0;border-bottom:1px solid transparent;
}
#topnav nav button:hover,#topnav nav button.active{color:var(--ink);border-bottom-color:var(--paired);}
#topnav nav button:focus-visible, a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--paired); outline-offset:2px;
}

/* ---------- view containers ---------- */
.view{display:none;}
.view.active{display:block;}

/* ---------- prologue + chapter spine's own scroll region ---------- */
/* Bounded, one-viewport-tall scroll container holding the prologue and all
   8 chapters, with its own mandatory snap — isolated from the page's normal
   scroll so mandatory snapping can never trap the reader against later
   free-scroll content (Metaphors, footer). See the html{} comment above for
   the full history of why this moved off html/body. */
.spine-scroll{
  height:100vh; overflow-y:auto;
  scroll-snap-type:y mandatory;
}

/* ---------- hero / prologue ---------- */
.prologue{
  min-height:80vh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;
  padding:5rem 1.5rem 4rem;
  background:
    radial-gradient(ellipse 60% 40% at 25% 20%, var(--amber-glow), transparent 60%),
    radial-gradient(ellipse 60% 40% at 75% 30%, var(--turq-glow), transparent 60%);
  /* .spine-scroll (above) is mandatory-snap, so the top of the page has to be a
     snap target too — otherwise mandatory snapping pulls even a fresh page LOAD
     toward the nearest valid snap point, which is Chapter 1 (the first
     .chapter-section), skipping the prologue's project title and the bubble-intro
     sequence entirely before the reader ever sees them. */
  scroll-snap-align:start;
}
.prologue .eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:1.4rem;
}
.prologue h1{
  font-size:clamp(2.3rem,6vw,4.2rem);font-weight:500;margin:0 0 1.6rem;
  letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--amber),var(--paired) 50%,var(--turq));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.prologue .sub{max-width:640px;color:var(--ink-dim);font-size:1.15rem;font-style:italic;margin-bottom:2.2rem;}
.prologue .authorial{max-width:620px;text-align:left;color:var(--ink-dim);font-size:.95rem;line-height:1.75;border-left:2px dashed var(--line);padding-left:1.2rem;margin-bottom:2.4rem;}
.prologue .authorial em{color:var(--ink-faint);}
.scrolldown{
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);
}

/* ---------- bubble intro (prologue teaching sequence) ---------- */
.bubble-intro{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;position:relative;cursor:pointer;user-select:none;
}
.bubble-intro:focus-visible{outline:2px solid var(--turq);outline-offset:6px;}
.bubble-intro .skip{
  position:absolute;top:0;right:0;
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);background:none;border:1px solid var(--line);border-radius:999px;
  padding:.5rem .9rem;cursor:pointer;
}
.bubble-intro .skip:hover,.bubble-intro .skip:focus-visible{color:var(--ink);border-color:var(--ink-faint);}

.bubble-field{position:relative;width:100%;height:220px;display:flex;align-items:center;justify-content:center;}
.bp-bubble{
  position:absolute;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff, rgba(255,255,255,.55) 100%);
  box-shadow:0 0 90px 26px rgba(255,255,255,.4);
  animation:bp-float 6s ease-in-out infinite;
  transition:background 1.1s ease, box-shadow 1.1s ease;
}
.bp-bubble[data-color="amber"]{
  background:radial-gradient(circle at 35% 30%, #fff3d9, var(--amber) 100%);
  box-shadow:0 0 100px 30px var(--amber-glow), 0 0 40px 6px rgba(224,169,78,.6);
}
.bp-bubble[data-color="turq"]{
  background:radial-gradient(circle at 35% 30%, #e3fbfb, var(--turq) 100%);
  box-shadow:0 0 100px 30px var(--turq-glow), 0 0 40px 6px rgba(94,201,201,.6);
}
/* The float animation's keyframes set `transform` on every frame, which silently overrides
   any translateX set by a class rule (animation transforms always win over static ones) —
   that's what was collapsing the "paired" bubbles back to the same spot: the bp-float
   keyframes kept resetting the X offset every frame. Each paired state below bakes its own
   horizontal offset into the keyframes alongside the vertical float, instead of relying on
   transform composition that plain CSS doesn't do. The "-in" variants front-load a slide
   from the off-screen/centered starting point over the first 20% of the animation, then
   settle into the same ease-in-out float as everything else — one continuous animation
   instead of a transition handing off to an animation (which would otherwise cause a visual
   snap, since transitions can't interpolate into animation-driven transform values).*/
.bp-bubble.secondary{width:96px;height:96px;opacity:0;transform:translateX(200px);animation:bp-float 6s ease-in-out infinite reverse;}
.bp-bubble.secondary.show{opacity:1;animation:bp-float-right-in 1.2s ease forwards, bp-float-right 6s ease-in-out 1.2s infinite reverse;transition:opacity 1s ease;}
.bp-bubble.primary.paired{animation:bp-float-left-in 1.2s ease forwards, bp-float-left 6s ease-in-out 1.2s infinite;}
@keyframes bp-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
@keyframes bp-float-left{0%,100%{transform:translateX(-90px) translateY(0);}50%{transform:translateX(-90px) translateY(-12px);}}
@keyframes bp-float-right{0%,100%{transform:translateX(110px) translateY(0);}50%{transform:translateX(110px) translateY(-12px);}}
@keyframes bp-float-left-in{from{transform:translateX(0) translateY(0);}to{transform:translateX(-90px) translateY(0);}}
@keyframes bp-float-right-in{from{transform:translateX(200px) translateY(0);}to{transform:translateX(110px) translateY(0);}}

.bp-caption{
  max-width:480px;min-height:70px;margin-top:1.4rem;padding:0 1.4rem;text-align:center;
  font-style:italic;color:var(--ink-dim);font-size:1.05rem;line-height:1.6;
  opacity:0;transform:translateY(6px);transition:opacity .6s ease, transform .6s ease;
}
.bp-caption.show{opacity:1;transform:translateY(0);}

.bp-progress{display:flex;gap:.5rem;justify-content:center;margin-top:1.6rem;}
.bp-progress span{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s;}
.bp-progress span.active{background:var(--ink-dim);transform:scale(1.3);}

.prologue-content{opacity:0;transition:opacity 1s ease;}
.prologue-content.show{opacity:1;}

/* ---------- chapter header ---------- */
.chapter-head{
  text-align:center;padding:3.5rem 1.5rem 2rem;
  border-top:1px solid var(--line);
}
.chapter-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
.chapter-head .eyebrow .prov{color:var(--paired);}
.chapter-head h2{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:500;margin:.4rem 0 .5rem;}
.chapter-head .count{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-faint);}
.chapter-head.section-divider{border-top:3px solid var(--line);padding-top:4.5rem;}
.section-intro{
  max-width:640px;margin:0 auto 2.5rem;text-align:left;color:var(--ink-dim);
  font-size:.95rem;line-height:1.75;border-left:2px dashed var(--line);padding:0 0 0 1.2rem;
}
.section-intro em{color:var(--ink-faint);}

/* each Metaphors subcategory (heading + its 1999/2025 card deck) starts
   hidden/offset and fades+lifts into place as the reader scrolls to it,
   wired by wireScrollReveal() below. Default state also covers browsers
   without IntersectionObserver (feature-checked in JS) — falls back to
   .is-visible added immediately, never leaving content permanently hidden. */
[data-reveal]{
  opacity:0; transform:translateY(28px);
  transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1);
}
[data-reveal].is-visible{opacity:1; transform:translateY(0);}

/* ---------- split screen spine ---------- */
.spine{
  display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line-soft);
}
.col{padding:2rem 1.4rem;min-height:40px;}
.col-1999{border-right:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(224,169,78,.03),transparent 300px);}
.col-2025{background:linear-gradient(180deg,rgba(94,201,201,.03),transparent 300px);}
.col-label{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:1.2rem;padding-bottom:.5rem;border-bottom:1px solid var(--line-soft);
  position:sticky;top:44px;background:var(--void);z-index:5;
}
.col-1999 .col-label{color:var(--amber);}
.col-2025 .col-label{color:var(--turq);}

/* fragment card */
.fragcard{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:3px;
  padding:1.3rem 1.3rem 1.1rem;
  margin-bottom:1.3rem;
  position:relative;
}
.col-1999 .fragcard{border-left:2px solid var(--amber-dim);}
.col-2025 .fragcard{border-left:2px solid var(--turq-dim);}
.fragcard .quote{
  font-size:1.08rem;font-style:italic;line-height:1.6;color:var(--ink);
  margin:0 0 .8rem;
}
.fragcard .quote::before{content:"\201C";}
.fragcard .quote::after{content:"\201D";}
.fragcard .subject{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:.6rem;
}
.fragcard .synopsis{color:var(--ink-dim);font-size:.95rem;margin-bottom:.7rem;}
.fragcard details{margin:.5rem 0;}
.fragcard details summary{cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;}
.fragcard details p{color:var(--ink-dim);font-size:.88rem;margin:.5rem 0 0;}
.fragcard .meta{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-faint);
  margin-top:.9rem;padding-top:.7rem;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;
}
.fragcard .meta a{color:var(--ink-dim);text-decoration:none;border-bottom:1px dotted var(--ink-faint);}
.meta-article-myths{display:inline-flex;gap:.3rem;margin-left:.4rem;vertical-align:middle;}
.meta-article-myths .regbadge{font-size:.56rem;padding:.14rem .4rem;margin-bottom:0;}

/* long quote truncation */
.quote.truncated{
  max-height:8.5em;overflow:hidden;position:relative;
  mask-image:linear-gradient(180deg,#000 65%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 65%,transparent 100%);
}
.expand-btn{
  display:inline-block;margin-top:.4rem;
  background:none;border:1px solid var(--line);color:var(--ink-dim);
  font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.3rem .6rem;cursor:pointer;border-radius:2px;
}
.expand-btn:hover{border-color:var(--paired);color:var(--ink);}

/* split badge */
.badge-split{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.28rem .55rem;border-radius:2px;margin-bottom:.6rem;
  border:1px solid var(--line);color:var(--ink-dim);background:rgba(94,201,201,.08);
  cursor:pointer;transition:all .2s;
}
.badge-split:hover{border-color:var(--turq);color:var(--turq);}

/* keyword chips */
.chip-row{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem;}
.chip-keyword{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.04em;
  padding:.2rem .5rem;border-radius:2px;
  border:1px solid var(--line);color:var(--ink-dim);background:rgba(224,169,78,.08);
  text-decoration:none;cursor:pointer;transition:all .15s;
}
.chip-keyword:hover{border-color:var(--paired);color:var(--ink);background:rgba(155,127,212,.1);}

/* register badge */
.regbadge{
  display:inline-flex;align-items:center;gap:.4rem;
  font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;
  padding:.28rem .55rem;border-radius:2px;margin-bottom:.6rem;
  border:1px solid;
}
.regbadge .subtheme{opacity:.75;font-weight:400;}
.regbadge.reg-sublime{color:var(--sublime);border-color:var(--sublime);background:rgba(255,224,138,.08);}
.regbadge.reg-sublime::before{content:"\2600";}
.regbadge.reg-demonic{color:var(--demonic);border-color:var(--demonic);background:rgba(201,85,107,.08);border-style:solid;}
.regbadge.reg-demonic::before{content:"\26A0";}
.regbadge.reg-paired{color:var(--paired);border-color:var(--paired);background:rgba(155,127,212,.08);border-style:double;border-width:3px;}
.regbadge.reg-paired::before{content:"\25C6";}
.regbadge.reg-deflated{color:var(--deflated);border-color:var(--deflated);background:transparent;border-style:dashed;}
.regbadge.reg-deflated::before{content:"\2205";}

/* chapter close band */
.chapter-close{
  grid-column:1/-1;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--void-2);
  padding:2.2rem 1.4rem;
  margin:0;
}
.chapter-close h3{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 1.2rem;text-align:center;
}
.close-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;max-width:900px;margin:0 auto;}
.close-col h4{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.08em;margin:0 0 .7rem;}
.close-col.c1999 h4{color:var(--amber);}
.close-col.c2025 h4{color:var(--turq);}
.regbar{display:flex;height:22px;border-radius:2px;overflow:hidden;margin-bottom:.5rem;border:1px solid var(--line);}
.regbar span{display:block;height:100%;}
.regbar .b-sublime{background:var(--sublime);}
.regbar .b-demonic{background:var(--demonic);}
.regbar .b-paired{background:var(--paired);}
.regbar .b-deflated{background:repeating-linear-gradient(45deg,var(--deflated),var(--deflated) 4px,#3a3f4a 4px,#3a3f4a 8px);}
.regbar .b-none{background:var(--line-soft);}
.close-legend{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:.5rem 1rem;}
.close-legend span{display:inline-flex;align-items:center;gap:.3rem;}
.close-legend i{width:9px;height:9px;display:inline-block;border-radius:1px;}

/* marginalia */
.marginalia{
  grid-column:1/-1;
  border-top:1px solid var(--paired);border-bottom:1px solid var(--paired);
  background:linear-gradient(90deg,rgba(155,127,212,.05),rgba(155,127,212,.02));
  padding:2rem 1.5rem;
  margin:0;
}
.marginalia .m-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--paired);margin-bottom:.6rem;
}
.marginalia h3{font-size:1.3rem;font-style:italic;font-weight:500;margin:0 0 .8rem;}
.marginalia p{color:var(--ink-dim);max-width:760px;font-size:.96rem;}
.marginalia .m-stat{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--ink);}
.marginalia.empty-slot{border-style:dashed;background:none;}
.marginalia.empty-slot p{color:var(--ink-faint);font-style:italic;}

/* ---------- chapter 1: cross-era pair carousel ---------- */
.pair-carousel{border-top:1px solid var(--line-soft);}
.pair-slide-head{
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.5rem;
  padding:1.2rem 1.4rem 0;font-family:'IBM Plex Mono',monospace;font-size:.68rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
}
.pair-motif{color:var(--paired);}
.pair-spine{border-top:none;}
.pair-nav-row{
  display:flex;align-items:center;justify-content:center;gap:1.2rem;
  padding:.5rem 1.4rem 1.8rem;
}
.pair-nav-btn{
  background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:50%;
  width:36px;height:36px;cursor:pointer;font-size:1rem;line-height:1;
}
.pair-nav-btn:hover{border-color:var(--paired);color:var(--ink);}
.pair-dots{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;max-width:320px;}
.pair-dot{width:7px;height:7px;border-radius:50%;border:none;background:var(--line);cursor:pointer;padding:0;}
.pair-dot.active{background:var(--paired);}
.pair-dot:hover{background:var(--ink-faint);}

/* ---------- chapter 1 (replacement): seven-chapter scrollytelling spine ---------- */
.chapters{position:relative;}

/* the persistent macro canvas — pinned while chapter text scrolls over it */
.macro-stage{
  position:sticky; top:0; height:100vh; width:100%;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; pointer-events:none; z-index:0;
}
.macro-stage svg{width:100%;height:100%;}
.macro-node circle{transition:fill .5s ease, opacity .5s ease;}
.macro-node{will-change:transform;}

/* each chapter's text content scrolls in normal flow, above the pinned canvas.
   height (not min-height) plus overflow-y:auto: scroll-snap needs each section to
   occupy exactly one viewport so the reader always comes to rest on a whole
   chapter, never mid-chapter — min-height would let a chapter with a lot of
   curated .chapter-micro content grow taller than 100vh, which breaks that
   one-chapter-per-screen rest state snap-scroll depends on. overflow-y:auto lets
   any chapter that does end up taller than the viewport scroll internally instead
   of clipping its content or breaking the snap points of chapters after it. */
.chapter-section{
  position:relative; z-index:1; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; justify-content:center;
  padding:4rem 1.4rem; pointer-events:none;
  scroll-snap-align:start; scroll-snap-stop:always;
}
/* Diptych's grid (legend + SVG) regularly exceeds 100vh — height:100vh +
   overflow-y:auto on the base rule would trap scroll inside this section's
   own scrollbar forever, since scroll-snap-stop:always never lets the
   gesture "escape" a snap point that's still capturing input. So it grows
   with its content instead of clipping to one screen. Keeps scroll-snap-
   align:start (it's still a real staircase step, and .spine-scroll being a
   bounded container means there's no trap risk in keeping it) but drops
   scroll-snap-stop to normal so a scroll gesture can still carry through it
   once the reader is done, rather than re-catching every gesture forever. */
.chapter-section--overflow{
  height:auto; min-height:100vh; overflow-y:visible;
  scroll-snap-stop:normal;
}
.chapter-section .chapter-head, .chapter-section .chapter-prose,
.chapter-section .chapter-micro{ pointer-events:auto; }
.chapter-section .chapter-head{border-top:none;padding-top:0;}
.chapter-section .chapter-prose{
  max-width:560px; margin:2rem auto 0; color:var(--ink-dim);
  font-style:italic; line-height:1.7;
}
.chapter-section .chapter-micro{max-width:720px;margin:2.5rem auto 0;}
.chapter-micro-spine{grid-template-columns:1fr 1fr;border-top:none;gap:0 1.2rem;}
.chapter-micro-spine .col{padding:0;background:none;min-height:0;}
.chapter-micro-spine .col-label{position:static;background:none;padding-bottom:.4rem;margin-bottom:.7rem;}
.fragcard-compact{padding:.9rem 1rem .8rem;margin-bottom:0;cursor:pointer;transition:border-color .2s;}
.fragcard-compact:hover{border-color:var(--paired);}
.fragcard-compact .quote{font-size:.85rem;line-height:1.5;margin:0 0 .5rem;max-height:6em;}
.fragcard-compact .subject{font-size:.62rem;margin-bottom:.4rem;}
.fragcard-compact .meta{font-size:.65rem;}
@media (max-width:640px){ .chapter-micro-spine{grid-template-columns:1fr;} }

/* metaphor declarations — a horizontal band well above the chapter head/cards,
   not vertically centered on the whole section: with fragment cards now filling
   most of the section's height, centering on the full box put this text right
   on top of the card headers instead of in clear space. */
.declaration-pair{
  position:absolute; top:4.5rem; left:0; right:0; display:flex; align-items:flex-start; justify-content:center;
  gap:3rem; pointer-events:none; z-index:2;
}
.declaration{
  font-family:'Newsreader',Georgia,serif; font-style:italic; font-weight:500;
  font-size:clamp(1.3rem,3vw,2rem); opacity:0; white-space:nowrap;
  text-shadow:0 2px 24px var(--void);
  transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1);
}
.declaration.a{color:var(--amber); transform:translateX(-40px);}
.declaration.b{color:var(--turq); transform:translateX(40px);}
.declaration.show{opacity:1; transform:translateX(0);}
@media (prefers-reduced-motion: reduce){ .declaration{transition:opacity .15s;} }

/* Recede target: once the centered declaration's hold timer fires, it fades
   out and this badge fades in — anchored to .chapter-head (position:relative)
   so it sits flush beside the chapter title instead of pinned to the far
   corners of the section, which read as disconnected from the chapter. */
.chapter-head{position:relative;}
.declaration-flank{
  position:absolute; top:.15em; font-size:.68rem; font-family:'IBM Plex Mono',monospace;
  font-style:normal; letter-spacing:.02em; white-space:normal; max-width:200px;
  opacity:0; transition:opacity .8s ease; line-height:1.4;
}
.declaration-flank.show{opacity:.85;}
.declaration-flank.a{color:var(--amber); right:calc(100% + 1.6rem); text-align:right;}
.declaration-flank.b{color:var(--turq); left:calc(100% + 1.6rem); text-align:left;}
@media (max-width:900px){ .declaration-flank{display:none;} }
@media (prefers-reduced-motion: reduce){ .declaration-flank{transition:opacity .15s;} }

/* ---------- chapter 7: correspondences grid ---------- */
.corr-empty{
  text-align:center;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;
  font-size:.75rem;padding:2rem 0;
}

/* ---------- Diptych — SVG bubble-pair diagram, ported from the prototype ---------- */
.diptych-wrap{max-width:960px;margin:0 auto;}
.diptych-legend{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:1.6rem;}
.diptych-legend button{
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.02em;
  background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink-faint);
  padding:.35rem .75rem;cursor:pointer;transition:color .2s,border-color .2s;
}
.diptych-legend button:hover{color:var(--ink);border-color:var(--ink-faint);}
.diptych-legend button.active{color:var(--paired);border-color:var(--paired);}

.diptych-stage svg{width:100%;height:auto;display:block;}
.diptych-frame{max-width:960px;margin:0 auto;border:1px solid var(--line-soft);padding:6px;}
.diptych-frame-inner{
  border:1px solid var(--line);padding:44px 28px 20px;position:relative;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.025), transparent 62%);
}
.diptych-caption{
  text-align:center;margin-top:1.1rem;font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-faint);
}
.diptych-caption em{color:var(--ink-dim);font-style:italic;text-transform:none;letter-spacing:0;}

.diptych-col-label{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;}
.diptych-col-label.a{fill:var(--amber);}
.diptych-col-label.b{fill:var(--turq);}

.diptych-cell{cursor:pointer;transition:opacity .35s;}
.diptych-cell circle.core{transition:filter .3s, transform .3s;transform-box:fill-box;transform-origin:center;}
.diptych-cell circle.core.a{fill:var(--amber);}
.diptych-cell circle.core.b{fill:var(--turq);}
.diptych-cell:hover circle.core{filter:brightness(1.15);}

.diptych-is-dimmed{opacity:.14;}
.diptych-is-picked circle.core{transform:scale(1.35);}
.diptych-is-picked circle.core.a{filter:drop-shadow(0 0 10px rgba(224,169,78,.4));}
.diptych-is-picked circle.core.b{filter:drop-shadow(0 0 10px rgba(94,201,201,.4));}

.diptych-bob{animation:diptych-bob-float var(--bob-dur,5s) ease-in-out var(--bob-delay,0s) infinite;}
@keyframes diptych-bob-float{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(var(--bob-dx,1.5px), var(--bob-dy,-2px));} }
@media (prefers-reduced-motion: reduce){ .diptych-bob{animation:none;} }

.diptych-connector-line{fill:none;stroke:var(--ink-faint);stroke-width:1.4px;pointer-events:none;}
.diptych-connector-dot{pointer-events:none;}
.diptych-hinge-line{stroke:var(--line);stroke-width:1px;stroke-dasharray:1,4;}
.diptych-hinge-plate{fill:var(--void-2);stroke:var(--line-soft);stroke-width:1px;}
.diptych-hinge-pin{fill:var(--ink-faint);}

.diptych-tooltip{
  position:fixed;pointer-events:none;z-index:920;
  background:var(--void-2);border:1px solid var(--line);border-radius:8px;
  padding:.45rem .7rem;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-dim);
  opacity:0;transform:translateY(4px);transition:opacity .15s, transform .15s;max-width:220px;
}
.diptych-tooltip.show{opacity:1;transform:translateY(0);}
.diptych-tooltip .t-year.a{color:var(--amber);font-weight:600;}
.diptych-tooltip .t-year.b{color:var(--turq);font-weight:600;}

.diptych-panel{
  position:fixed;left:0;right:0;bottom:0;z-index:910;
  background:var(--void-2);border-top:1px solid var(--line);
  max-height:52vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  padding:1.4rem 1.2rem 2rem;
}
.diptych-panel.open{transform:translateY(0);}
.diptych-panel-inner{max-width:900px;margin:0 auto;}
.diptych-panel-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;}
.diptych-panel-family{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
.diptych-panel-motif{color:var(--paired);font-style:italic;font-size:.9rem;flex:1;}
.diptych-panel-close{background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink-faint);width:26px;height:26px;cursor:pointer;font-size:.9rem;line-height:1;}
.diptych-panel-close:hover{color:var(--ink);border-color:var(--ink-faint);}
.diptych-panel-cards{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media (max-width:640px){ .diptych-panel-cards{grid-template-columns:1fr;} }
.diptych-pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.15rem;}
.diptych-pcard.col-1999{border-left:3px solid var(--amber-dim);}
.diptych-pcard.col-2025{border-left:3px solid var(--turq-dim);}
.diptych-pcard .yr{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.5rem;}
.diptych-pcard.col-1999 .yr{color:var(--amber);}
.diptych-pcard.col-2025 .yr{color:var(--turq);}
.diptych-pcard .quote{font-size:.92rem;line-height:1.6;color:var(--ink-dim);margin:0 0 .7rem;}
.diptych-pcard .quote mark{background:none;font-weight:600;font-style:normal;font-size:1.16em;padding:0 .04em;}
.diptych-pcard.col-1999 .quote mark{color:var(--amber);}
.diptych-pcard.col-2025 .quote mark{color:var(--turq);}
.diptych-pcard .meta{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-faint);border-top:1px solid var(--line-soft);padding-top:.5rem;}

/* ---------- metaphors: deck + cards ---------- */
.metadeck{position:relative;min-height:260px;margin-bottom:2.2rem;padding-bottom:.6rem;}
.deck-hint{
  text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--ink-faint);
  letter-spacing:.06em;text-transform:uppercase;margin-top:.3rem;
}

/* fallback card — no source_image curated yet */
.metacard{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:1.1rem;position:absolute;top:0;left:0;right:0;min-height:260px;
  transition:transform .25s ease, box-shadow .25s ease;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
  cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;
}
.metadeck.settled .metacard{cursor:default;}
.col-1999 .metacard{border-left:2px solid var(--amber-dim);}
.col-2025 .metacard{border-left:2px solid var(--turq-dim);}
.metacard .subject{
  font-family:'Newsreader',serif;font-style:italic;font-size:1.05rem;color:var(--ink);
  margin-bottom:.5rem;line-height:1.4;
}
.metacard .meta{
  font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--ink-faint);
  margin-top:auto;padding-top:.5rem;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:.3rem .7rem;
}
.metacard .meta a{color:var(--ink-dim);text-decoration:none;border-bottom:1px dotted var(--ink-faint);}
.metacard .no-image-flag{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--deflated);border:1px dashed var(--deflated);border-radius:2px;padding:.15rem .4rem;margin-bottom:.7rem;align-self:flex-start;
}

/* bestiary flip-card — tarot front / specimen-label back */
.beastcard{perspective:1000px;position:absolute;top:0;left:0;right:0;min-height:260px;cursor:pointer;}
.beastcard-inner{
  position:relative;width:100%;height:100%;min-height:260px;transform-style:preserve-3d;
  transition:transform .5s;
}
.beastcard[data-flipped="1"] .beastcard-inner{transform:rotateY(180deg);}
.beastcard-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);border-radius:10px;
  padding:1.1rem;display:flex;flex-direction:column;justify-content:space-between;
}

/* front — tarot card */
.beastcard-front{
  background:
    radial-gradient(ellipse at 30% 20%, rgba(224,169,78,.10), transparent 60%),
    var(--panel);
}
.col-2025 .beastcard-front{
  background:
    radial-gradient(ellipse at 30% 20%, rgba(94,201,201,.10), transparent 60%),
    var(--panel);
}
.beastcard-tag{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber-dim);
}
.col-2025 .beastcard-tag{color:var(--turq-dim);}
.beastcard-voice{
  font-family:'Newsreader',serif;font-style:italic;font-size:19px;line-height:1.35;color:var(--ink);
}
.beastcard-hint{
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);
}

/* back — specimen label / field report */
.beastcard-back{
  transform:rotateY(180deg);
  background:var(--void-2);
}
.beastcard-back .specimen-tag{
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);
}
.beastcard-back .specimen-quote{
  font-size:13px;line-height:1.55;color:var(--ink-dim);font-style:normal;font-family:'Newsreader',serif;
  margin:0;
}
.beastcard-back .specimen-quote::before{content:"\201C";}
.beastcard-back .specimen-quote::after{content:"\201D";}
.beastcard-back .meta{
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--turq);
}
.col-1999 .beastcard-back .meta{color:var(--amber);}
.beastcard-back .meta a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;}

.metaphor-close-grid .regbar span{display:block;height:100%;}
.mc-legend{font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:.4rem .8rem;margin-top:.8rem;}
.mc-legend span{display:inline-flex;align-items:center;gap:.3rem;}
.mc-legend i{width:9px;height:9px;display:inline-block;border-radius:1px;}

/* ---------- layer 2 : evidence ---------- */
.evidence-shell{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:70vh;}
.filters{
  border-right:1px solid var(--line);padding:1.4rem 1rem;
  font-family:'IBM Plex Mono',monospace;font-size:.75rem;
  position:sticky;top:44px;align-self:start;max-height:calc(100vh - 44px);overflow-y:auto;
}
.filters h4{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:1.1rem 0 .5rem;}
.filters h4:first-child{margin-top:0;}
.filter-group label{display:flex;align-items:center;gap:.4rem;padding:.2rem 0;color:var(--ink-dim);cursor:pointer;}
.filter-group label:hover{color:var(--ink);}
.filter-group input{accent-color:var(--paired);}
.filter-search{
  width:100%;background:var(--void-2);border:1px solid var(--line);color:var(--ink);
  font-family:inherit;font-size:.75rem;padding:.35rem .5rem;border-radius:2px;margin-bottom:.4rem;
}
.filter-search:focus{outline:none;border-color:var(--paired);}
.show-all-filter{
  display:block;background:none;border:none;color:var(--ink-faint);cursor:pointer;
  font-family:inherit;font-size:.68rem;padding:.3rem 0;text-decoration:underline;
}
.show-all-filter:hover{color:var(--paired);}

.edge-type-row{display:flex;align-items:center;justify-content:space-between;gap:.4rem;}
.edge-type-row label{flex:1;min-width:0;}
.edge-only-btn{
  background:none;border:1px solid var(--line);color:var(--ink-faint);cursor:pointer;
  font-family:inherit;font-size:.6rem;letter-spacing:.03em;text-transform:uppercase;
  padding:.15rem .4rem;border-radius:2px;flex-shrink:0;opacity:0;transition:opacity .12s;
}
.edge-type-row:hover .edge-only-btn{opacity:1;}
.edge-only-btn:hover{border-color:var(--paired);color:var(--paired);}
.edge-only-btn:disabled{opacity:.25 !important;cursor:default;}
.edge-only-btn:disabled:hover{border-color:var(--line);color:var(--ink-faint);}
@media (hover:none){.edge-only-btn{opacity:1;}}
.filter-count{color:var(--ink-faint);}
.clear-filters{
  background:none;border:1px solid var(--line);color:var(--ink-dim);
  padding:.3rem .6rem;margin-top:1rem;cursor:pointer;font-family:inherit;font-size:.7rem;
  text-transform:uppercase;letter-spacing:.05em;
}
.results{padding:1.4rem;}
.results-count{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--ink-faint);margin-bottom:1rem;}

/* article groups — chronologically sorted, collapsed by default; each toggle reveals that
   article's matching fragments only (results already respect the active filters) */
.evidence-group{border-bottom:1px solid var(--line-soft);}
.evidence-group summary{
  position:relative;
  padding:.9rem .2rem .9rem 1.5rem;cursor:pointer;list-style:none;
}
.evidence-group summary::-webkit-details-marker{display:none;}
.evidence-group summary:hover{background:rgba(255,255,255,.02);}
.evidence-group summary::before{
  content:"▸";position:absolute;left:0;top:1rem;color:var(--ink-faint);
  transition:transform .15s;font-size:.8rem;
}
.evidence-group[open] summary::before{transform:rotate(90deg);}
.evidence-group .eg-summary-top{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--ink-faint);margin-bottom:.35rem;
}
.evidence-group.y1999 .eg-date{color:var(--amber);}
.evidence-group.y2025 .eg-date{color:var(--turq);}
.evidence-group .eg-title{
  font-family:'Newsreader',serif;font-size:1.25rem;font-weight:500;color:var(--ink);
  line-height:1.35;margin-bottom:.5rem;
}
.evidence-group .eg-tags{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;}
.evidence-group .eg-tags .regbadge{margin-bottom:0;}
.evidence-group .eg-chip{
  font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.03em;
  padding:.22rem .55rem;border-radius:2px;border:1px solid var(--line);color:var(--ink-dim);
}
.evidence-group .eg-chip-author{color:var(--ink-faint);font-style:italic;}
.evidence-group .eg-body{padding:0 .2rem .8rem 1.5rem;}

.result-row{
  padding:.7rem 0;border-top:1px solid var(--line-soft);cursor:pointer;
  display:grid;grid-template-columns:1fr 100px;gap:1rem;align-items:start;
}
.result-row:first-child{border-top:none;}
.result-row:hover{background:rgba(255,255,255,.02);}
.result-row .rtext{font-size:.92rem;color:var(--ink-dim);font-style:italic;line-height:1.4;}
.result-row .rreg{font-family:'IBM Plex Mono',monospace;font-size:.62rem;text-align:right;color:var(--ink-faint);}

/* modal / detail overlay */
.overlay{
  position:fixed;inset:0;background:rgba(5,4,8,.82);backdrop-filter:blur(4px);
  z-index:900;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:3rem 1rem;
}
.overlay.open{display:flex;}
.overlay .fragcard{max-width:640px;width:100%;background:var(--panel);}
/* full-screen overlay gets its own type scale: the quotation is the reason the
   reader opened this view, so it dominates — subject/synopsis/context/meta step
   down from there instead of matching the compact-card and grid uses of the
   same markup, which need to stay small and uniform. */
.overlay .fragcard{padding:2.4rem 2.2rem 1.8rem;}
.overlay .fragcard .subject{font-size:.72rem;letter-spacing:.1em;color:var(--ink-dim);margin-bottom:1rem;}
.overlay .fragcard .quote{
  font-size:clamp(1.3rem,2.6vw,1.7rem);line-height:1.55;font-weight:500;
  color:var(--ink);margin-bottom:1.3rem;
}
.overlay .fragcard .synopsis{font-size:1rem;color:var(--ink-dim);margin-bottom:1rem;}
.overlay .fragcard details summary{font-size:.72rem;}
.overlay .fragcard details p{font-size:.92rem;}
.overlay .fragcard .meta{font-size:.7rem;margin-top:1.4rem;padding-top:1rem;}
.overlay-close{
  position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--line);color:var(--ink-dim);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;
}

/* split fragment navigation */
.split-nav{
  display:block;max-width:640px;width:100%;margin:0 auto;
}
.split-shadow{
  background:var(--panel);border:1px solid var(--line);padding:.8rem;border-radius:3px;
  margin-bottom:1rem;cursor:pointer;transition:all .2s;opacity:.5;max-height:120px;overflow:hidden;
}
.split-shadow:hover{opacity:.8;border-color:var(--paired);}
.split-shadow.prev{border-left:3px solid var(--amber-dim);}
.split-shadow.next{border-left:3px solid var(--turq-dim);}
.split-shadow .split-label{
  font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:.3rem;display:block;
}
.split-shadow p{margin:0;color:var(--ink-dim);line-height:1.3;font-size:.8rem;font-style:italic;}
.split-center{margin:1rem 0;}
.split-nav .fragcard{margin-bottom:0;}

/* article page */
.article-page{max-width:760px;margin:0 auto;padding:2.5rem 1.4rem;}
.article-page .a-title{font-size:1.9rem;margin:0 0 .3rem;}
.article-page .a-meta{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-faint);margin-bottom:2rem;}
.back-link{
  display:inline-block;margin:1.4rem;font-family:'IBM Plex Mono',monospace;font-size:.72rem;
  color:var(--ink-dim);text-decoration:none;border-bottom:1px dotted var(--ink-faint);
}

/* ---------- layer 3: method ---------- */
.method-page{max-width:720px;margin:0 auto;padding:3rem 1.4rem 5rem;}
.method-page h2{font-size:1.8rem;margin-top:2.4rem;}
.method-page h2:first-child{margin-top:0;}
.method-page p{color:var(--ink-dim);}
.method-page table{width:100%;border-collapse:collapse;margin:1rem 0;font-family:'IBM Plex Mono',monospace;font-size:.8rem;}
.method-page th,.method-page td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;}
.method-page th{color:var(--ink-faint);font-weight:500;}

/* ---------- graph view ---------- */
.graph-shell{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 44px);}
.graph-controls{
  border-right:1px solid var(--line);padding:1.2rem 1rem;overflow-y:auto;
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;
}
.graph-controls h4{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:1rem 0 .4rem;}
.graph-controls h4:first-child{margin-top:0;}
.graph-controls label{display:flex;align-items:center;gap:.4rem;padding:.2rem 0;color:var(--ink-dim);}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
'use strict';

/* =========================================================================
   0. DATA LOADING
   ========================================================================= */
let DATA = null;
window.OVERLONG_QUOTATIONS = [];

async function boot(){
  try{
    const res = await fetch('site-data.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    DATA = await res.json();
  }catch(err){
    document.getElementById('fatal-error').style.display='flex';
    document.getElementById('fatal-error').innerHTML =
      '<div><p>Could not load <b>site-data.json</b>.</p>'+
      '<p style="color:#a29dbd;font-size:.85rem;">Make sure it sits next to index.html and you are serving this over a local static server (not file://).</p>'+
      '<p style="color:#6b6784;font-size:.75rem;">'+ (err && err.message ? err.message : err) +'</p></div>';
    return;
  }
  init();
}

/* =========================================================================
   1. ACCESSORS  (single source of truth for myth_ids shape etc.)
   ========================================================================= */

// myth_ids is an array of {narrative, subtheme, register, stance} objects — NEVER plain ids.
function getMyths(entity){
  return (entity && Array.isArray(entity.myth_ids)) ? entity.myth_ids : [];
}

function article(id){ return DATA.articles[id]; }
function fragment(id){ return DATA.fragments[id]; }
function company(id){ return DATA.companies[id]; }
function authorLabel(id){ return (DATA.authors[id] && DATA.authors[id].label) || id; }
function authorOf(art){ return (art && DATA.authors[art.author_id]) || null; }
function myth(narrative){ return DATA.myths[narrative]; }
function topicLabel(id){ return (DATA.topics[id] && DATA.topics[id].label) || id; }
function peterLabel(id){ return (DATA.peters_stages[id] && DATA.peters_stages[id].label) || id; }
function metaphorLabel(id){ return (DATA.metaphor_categories[id] && DATA.metaphor_categories[id].label) || id; }
function voiceLabel(id){ return (DATA.voice_roles[id] && DATA.voice_roles[id].label) || id; }
function metaphorEntry(id){ return DATA.metaphors[id]; }
function keywordLabel(id){ return (DATA.keyword_vocabulary && DATA.keyword_vocabulary[id]) || id; }
function motifLabel(id){ return (DATA.motifs && DATA.motifs[id]) || id; }
function metaphorsOfArticle(art){ return (art.metaphor_ids||[]).map(metaphorEntry).filter(Boolean); }

function allArticles(){ return Object.values(DATA.articles); }
function allFragments(){ return Object.values(DATA.fragments); }

function fragmentsOfArticle(art){
  return (art.fragment_ids||[]).map(fragment).filter(Boolean);
}

// deterministic shuffle (mulberry32), seeded — same order every reload, not chronological
function seededShuffle(arr, seed){
  const out = arr.slice();
  let s = seed;
  function rnd(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
  for(let i=out.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}
const CHAPTER_SEED = 20260729;

/* subthemes collected at runtime from fragment myth_ids */
function collectSubthemes(){
  const set = new Set();
  allFragments().forEach(f => getMyths(f).forEach(m => { if(m.subtheme) set.add(m.subtheme); }));
  return Array.from(set).sort();
}

/* biography chapters — which articles feed the 16 highlight pairs, an article's
   lead myth register (for the reckoning lens), and myth-narrative presence checks
   (for the border/mind lenses) */
function highlightPairArticleIds(){
  const ids = new Set();
  (DATA.highlight_pairs||[]).forEach(p=>{
    const fa = fragment(p.a), fb = fragment(p.b);
    if(fa) ids.add(fa.article_id);
    if(fb) ids.add(fb.article_id);
  });
  return ids;
}

function articleRegister(art){
  const myths = getMyths(art);
  if(!myths.length) return null;
  return myths[0].stance === 'deflated' ? 'deflated' : myths[0].register;
}

function articleHasMyth(art, narrative){
  return getMyths(art).some(m => m.narrative === narrative);
}

/* =========================================================================
   2. CODING STATUS FOOTER
   ========================================================================= */
function renderStatusFooter(){
  document.getElementById('status-footer').innerHTML =
    `Janyne Leonardi de Carvalho &middot; MA Digital Innovation in Journalism Studies, Concordia University`;
}

/* =========================================================================
   3. REGISTER BADGE + FRAGMENT CARD RENDERING
   ========================================================================= */
function registerBadgeHTML(m){
  // m: {narrative, subtheme, register, stance}
  const stance = m.stance;
  const reg = m.register; // sublime|demonic|paired|null
  const cls = stance === 'deflated' ? 'reg-deflated' : ('reg-'+(reg||'unknown'));
  const mythLbl = (myth(m.narrative)||{}).label || m.narrative;
  const stanceLbl = stance === 'deflated' ? 'Deflated' : 'Carried';
  const regLbl = stance === 'deflated' ? 'no transcendence claimed' : (DATA.registers[reg]||{}).label || reg;
  return `<span class="regbadge ${cls}" title="${mythLbl} — ${stanceLbl}">
    ${mythLbl} &middot; ${regLbl}
    ${m.subtheme ? `<span class="subtheme">/ ${escapeHTML(m.subtheme)}</span>` : ''}
  </span>`;
}

function escapeHTML(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let fragCardCounter = 0;
function fragmentCardHTML(f, opts){
  opts = opts||{};
  const art = article(f.article_id);
  const myths = getMyths(f);
  const isLong = f.quotation && f.quotation.length > 1200;
  if(isLong && window.OVERLONG_QUOTATIONS.indexOf(f.id) === -1) window.OVERLONG_QUOTATIONS.push(f.id);
  const uid = 'fc'+(fragCardCounter++);

  const badges = myths.map(registerBadgeHTML).join(' ');

  const metaBits = [];
  if(art){
    const articleMyths = getMyths(art);
    const articleMythBadges = articleMyths.map(registerBadgeHTML).join('');
    metaBits.push(`<a href="#article/${art.id}" data-nav-article="${art.id}">${escapeHTML(art.title)}</a>${articleMythBadges ? `<span class="meta-article-myths">${articleMythBadges}</span>` : ''}`);
    metaBits.push(escapeHTML(authorLabel(art.author_id)));
    metaBits.push('The New York Times');
    metaBits.push(escapeHTML(art.date||art.year));
  }

  const splitBadge = f.split_from ? `<span class="badge-split" data-split-from="${escapeHTML(f.split_from)}">split from ${escapeHTML(f.split_from)}</span>` : '';

  const kwChips = (f.keywords||[]).map(kid=>
    `<a class="chip-keyword" href="#evidence?keyword=${encodeURIComponent(kid)}" data-nav-keyword="${escapeHTML(kid)}" title="${escapeHTML(kid)}">${escapeHTML(keywordLabel(kid))}</a>`
  ).join('');

  if(opts.compact){
    return `<article class="fragcard fragcard-compact" data-frag-id="${f.id}" data-open-frag="${f.id}" tabindex="0" role="button" aria-label="Read full fragment">
      ${f.primary_subject ? `<div class="subject">${escapeHTML(f.primary_subject)}</div>` : ''}
      <p class="quote truncated" id="${uid}">${escapeHTML(f.quotation)}</p>
      <div class="meta">${metaBits.join(' &middot; ')}</div>
    </article>`;
  }

  return `<article class="fragcard" data-frag-id="${f.id}">
    ${badges ? `<div>${badges}</div>` : ''}
    ${splitBadge}
    ${f.primary_subject ? `<div class="subject">${escapeHTML(f.primary_subject)}</div>` : ''}
    <p class="quote ${isLong?'truncated':''}" id="${uid}">${escapeHTML(f.quotation)}</p>
    ${isLong ? `<button class="expand-btn" data-expand="${uid}">Expand full quotation</button>` : ''}
    ${f.synopsis ? `<p class="synopsis">${escapeHTML(f.synopsis)}</p>` : ''}
    ${f.article_context ? `<details><summary>Article context</summary><p>${escapeHTML(f.article_context)}</p></details>` : ''}
    ${kwChips ? `<div class="chip-row">${kwChips}</div>` : ''}
    <div class="meta">${metaBits.join(' &middot; ')}</div>
  </article>`;
}

function wireFragmentCardInteractions(root){
  root.querySelectorAll('[data-expand]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById(btn.getAttribute('data-expand'));
      el.classList.remove('truncated');
      btn.remove();
    });
  });
  root.querySelectorAll('[data-nav-article]').forEach(a=>{
    a.addEventListener('click', (e)=>{
      e.preventDefault();
      e.stopPropagation(); // don't also trigger the enclosing compact card's open-overlay handler
      navigateTo('article', {id:a.getAttribute('data-nav-article')});
    });
  });
  root.querySelectorAll('[data-split-from]').forEach(badge=>{
    badge.addEventListener('click', ()=>{
      // navigate to the parent fragment or show all siblings
      const parentId = badge.getAttribute('data-split-from');
      const f = fragment(parentId);
      if(f) openFragmentOverlay(parentId);
    });
  });
  root.querySelectorAll('.fragcard-compact[data-open-frag]').forEach(card=>{
    card.addEventListener('click', ()=>{
      openFragmentOverlay(card.getAttribute('data-open-frag'));
    });
    card.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openFragmentOverlay(card.getAttribute('data-open-frag')); }
    });
  });
}

/* =========================================================================
   4. MARGINALIA  (still used by the Metaphors section's BUBBLE_INTERLUDE below)
   ========================================================================= */
function marginaliaHTML(m){
  if(m.empty){
    return `<div class="marginalia empty-slot"><div class="m-eyebrow">${m.eyebrow}</div>${m.build()}</div>`;
  }
  return `<div class="marginalia"><div class="m-eyebrow">${m.eyebrow}</div><h3>${m.title}</h3>${m.build()}</div>`;
}

/* =========================================================================
   5. LAYER 1 — BIOGRAPHY (fragment pairs + metaphors)
   ========================================================================= */

// The 16 curated cross-era pairs (DATA.highlight_pairs)
// — each pair links one 1999 fragment and one 2025 fragment around a shared motif. Rendered
// one pair at a time (a slide), not all 16 at once.
function pairSlideHTML(pair, index, total){
  const fa = fragment(pair.a), fb = fragment(pair.b);
  if(!fa || !fb) return '';
  return `<div class="pair-slide" data-pair-index="${index}" ${index===0?'':'style="display:none"'}>
    <div class="pair-slide-head">
      <span class="pair-count">Pair ${index+1} of ${total}</span>
      ${pair.motif ? `<span class="pair-motif">${escapeHTML(motifLabel(pair.motif))}</span>` : ''}
    </div>
    <div class="spine pair-spine">
      <div class="col col-1999">
        <div class="col-label">1999</div>
        ${fragmentCardHTML(fa)}
      </div>
      <div class="col col-2025">
        <div class="col-label">2025</div>
        ${fragmentCardHTML(fb)}
      </div>
    </div>
  </div>`;
}

function pairCarouselHTML(){
  const pairs = (DATA.highlight_pairs||[]);
  if(!pairs.length) return '<p class="pending">No highlight pairs coded yet.</p>';
  const slides = pairs.map((p,i)=>pairSlideHTML(p,i,pairs.length)).join('');
  const dots = pairs.map((_,i)=>`<button class="pair-dot ${i===0?'active':''}" data-pair-goto="${i}" aria-label="Pair ${i+1}"></button>`).join('');
  return `<div class="pair-carousel" data-pair-total="${pairs.length}">
    ${slides}
    <div class="pair-nav-row">
      <button class="pair-nav-btn" id="pair-prev-btn" aria-label="Previous pair">&larr;</button>
      <div class="pair-dots">${dots}</div>
      <button class="pair-nav-btn" id="pair-next-btn" aria-label="Next pair">&rarr;</button>
    </div>
  </div>`;
}

function wirePairCarousel(root){
  const carousel = root.querySelector('.pair-carousel');
  if(!carousel) return;
  const total = +carousel.getAttribute('data-pair-total');
  let current = 0;
  const slides = carousel.querySelectorAll('.pair-slide');
  const dots = carousel.querySelectorAll('.pair-dot');
  function show(i){
    current = ((i % total) + total) % total;
    slides.forEach((s,idx)=>{ s.style.display = idx===current ? '' : 'none'; });
    dots.forEach((d,idx)=>d.classList.toggle('active', idx===current));
  }
  carousel.querySelector('#pair-prev-btn').addEventListener('click', ()=> show(current-1));
  carousel.querySelector('#pair-next-btn').addEventListener('click', ()=> show(current+1));
  dots.forEach(d=>{
    d.addEventListener('click', ()=> show(+d.getAttribute('data-pair-goto')));
  });
  // arrow-key navigation, scoped to when the carousel is actually in view — a plain
  // document-level listener would also fire while the reader is scrolling elsewhere,
  // which would be a confusing surprise.
  document.addEventListener('keydown', (e)=>{
    if(!carousel.isConnected) return;
    const rect = carousel.getBoundingClientRect();
    const inView = rect.top < window.innerHeight && rect.bottom > 0;
    if(!inView) return;
    if(e.key==='ArrowLeft') show(current-1);
    if(e.key==='ArrowRight') show(current+1);
  });
}

/* the macro bubble layer — 92 articles, one persistent force simulation that
   recolors/regroups per chapter instead of re-rendering */
function wireMacroLayer(root){
  const svg = d3.select(root.querySelector('#macroSvg'));
  if(svg.empty() || typeof d3 === 'undefined') return null;

  const bbox = root.querySelector('.macro-stage').getBoundingClientRect();
  const W = bbox.width, H = bbox.height;
  const pairArticleIds = highlightPairArticleIds();

  // stable pseudo-random baseline scatter, seeded per article id so it's
  // consistent across re-renders rather than reshuffling on every mount.
  // The trailing avalanche mix matters: a plain polynomial hash makes
  // seededRand(id+'x') and seededRand(id+'y') land within ~0.001 of each
  // other (their inputs differ only in the last char code, 'x' vs 'y' = 1),
  // which collapsed the whole scatter onto a visible diagonal line.
  function seededRand(str){
    let h = 0; for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
    h ^= h >>> 16; h = Math.imul(h, 0x45d9f3b);
    h ^= h >>> 16; h = Math.imul(h, 0x45d9f3b);
    h ^= h >>> 16;
    return ((h >>> 0) % 1000)/1000;
  }

  const nodes = allArticles().map(a => {
    const rx = seededRand(a.id+'x'), ry = seededRand(a.id+'y');
    return {
      id:a.id, year:String(a.year), peters:a.peters_primary,
      register: articleRegister(a),
      hasEog: articleHasMyth(a,'eog'), hasEhum: articleHasMyth(a,'ehum'),
      inPairs: pairArticleIds.has(a.id),
      baseX: W*0.15 + rx*W*0.7, baseY: H*0.2 + ry*H*0.6,
      x: W/2, y: H/2,
    };
  });

  const PETERS_COL = { economic: W*0.22, legal: W*0.5, cultural: W*0.78, unclear: W*0.5 };
  const REG_COLOR = { sublime:'var(--sublime)', demonic:'var(--demonic)', paired:'var(--paired)', deflated:'var(--deflated)' };

  let lens = 'mundane';

  function targetX(d){
    if(lens==='market' || lens==='rules') return PETERS_COL[d.peters] ?? W/2;
    return d.baseX;
  }
  function targetY(d){
    if(lens==='market') return d.peters==='economic' ? (d.year==='1999'?H*0.32:H*0.68) : H/2;
    if(lens==='rules')  return d.peters==='legal'     ? (d.year==='1999'?H*0.32:H*0.68) : H/2;
    return d.baseY;
  }
  function nodeOpacity(d){
    if(lens==='market') return d.peters==='economic' ? 1 : 0.15;
    if(lens==='rules')  return d.peters==='legal' ? 1 : 0.15;
    if(lens==='border') return d.hasEog ? 1 : 0.12;
    if(lens==='mind')   return d.hasEhum ? 1 : 0.12;
    if(lens==='denial') return d.register ? 1 : 0.2;
    return 0.85; // mundane baseline
  }
  function nodeColor(d){
    if(lens==='denial' && d.register) return REG_COLOR[d.register];
    return d.year==='1999' ? 'var(--amber)' : 'var(--turq)';
  }

  // forceX/forceY bake their per-node target into an internal array the first time
  // the force is initialized (on forceSimulation() or force.initialize()) — they do
  // NOT re-call targetX/targetY on every tick. Without re-initializing these two
  // forces on every lens change, switching `lens` silently has no effect on layout:
  // the sim keeps pulling nodes toward whichever targets were computed for the very
  // first lens ('mundane'), no matter what setLens() is called with afterward.
  const forceX = d3.forceX(targetX).strength(0.12);
  const forceY = d3.forceY(targetY).strength(0.12);

  const sim = d3.forceSimulation(nodes)
    .force('x', forceX)
    .force('y', forceY)
    .force('collide', d3.forceCollide(6))
    .force('charge', d3.forceManyBody().strength(-3))
    .on('tick', ticked);

  // `sel` is reassigned by restore() after teardown() empties the <svg> — ticked()
  // and setLens() always need the current join, not whatever was bound at mount time.
  let sel = svg.selectAll('g.macro-node').data(nodes, d=>d.id).join('g').attr('class','macro-node');
  sel.append('circle').attr('r', 4.5);

  function ticked(){
    sel.attr('transform', d=>`translate(${d.x},${d.y})`);
    sel.select('circle')
      .attr('fill', nodeColor)
      .attr('opacity', nodeOpacity);
  }

  function setLens(name){
    lens = name;
    forceX.initialize(nodes, Math.random);
    forceY.initialize(nodes, Math.random);
    sim.alpha(0.9).restart();
  }

  // Chapter 7 tears the canvas down once its Correspondences grid mounts, but a
  // reader who then scrolls back up above Chapter 7 needs the bubbles back — without
  // this, the macro layer is gone for the rest of the session and Chapters 1-6 read
  // as permanently broken/empty. restore() re-creates the join and resumes the sim;
  // wireChapterScroll() calls it whenever the reader re-enters the pre-hinge chapters.
  function teardown(onDone){
    sel.transition().duration(600).attr('opacity',0).on('end', function(){ d3.select(this).remove(); });
    sim.stop();
    if(onDone) setTimeout(onDone, 650);
  }

  function restore(){
    sel = svg.selectAll('g.macro-node').data(nodes, d=>d.id).join('g').attr('class','macro-node');
    sel.append('circle').attr('r', 4.5).attr('opacity', 0);
    forceX.initialize(nodes, Math.random);
    forceY.initialize(nodes, Math.random);
    sim.alpha(0.9).restart();
  }

  return { setLens, teardown, restore };
}

/* metaphor declaration staging — glide in centered on chapter entry, hold,
   fade out, then hand off to a small badge flanking the chapter title
   (stays visible until the next chapter re-triggers) */
function wireDeclarations(root){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const activeTimers = new Map();

  function play(chapterId){
    const wrap = root.querySelector(`[data-decl-for="${chapterId}"]`);
    const flanks = root.querySelectorAll(`[data-decl-flank-for="${chapterId}"]`);
    if(!wrap) return;
    clearTimeout(activeTimers.get(chapterId));
    const spans = wrap.querySelectorAll('.declaration');
    flanks.forEach(f => f.classList.remove('show'));
    spans.forEach(s => { s.classList.remove('badge'); s.classList.add('show'); });
    const t = setTimeout(()=>{
      spans.forEach(s => s.classList.remove('show')); // fade the centered version out
      flanks.forEach(f => f.classList.add('show'));   // hand off to the title-flanking badge
    }, reduced ? 200 : 2600);
    activeTimers.set(chapterId, t);
  }

  return { play };
}

/* scroll wiring — connects chapters to the macro layer + declarations +
   Chapter 7's absorption into the Correspondences grid. The hinge transition is
   reversible: scrolling past it tears the bubbles down once (the grid is built
   once and never re-rendered), but scrolling back up above it restores them, and
   scrolling back down to the hinge tears them down again — otherwise a reader who
   reaches the climax and then scrolls back up finds Chapters 1-6 permanently empty. */
function wireChapterScroll(root){
  const macro = wireMacroLayer(root);
  const decl = wireDeclarations(root);
  if(!macro) return;

  let gridBuilt = false;
  let torn = false;

  // threshold lowered from the natural "half the section is visible" reading:
  // that fraction is of the target's OWN box, and .chapter-section--overflow
  // (Diptych) can be well over one viewport tall, so requiring 50% of its own
  // height to be on-screen either fires very late or, on short viewports,
  // might not reliably fire at all. 0.25 still means "meaningfully scrolled
  // into this chapter," not just a sliver, and works for both box sizes.
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting || entry.intersectionRatio < 0.25) return;
      const chapterId = entry.target.getAttribute('data-chapter');

      if(chapterId === 'diptych'){
        if(torn) return;
        torn = true;
        decl.play('diptych');
        macro.teardown(()=>{
          if(gridBuilt) return;
          gridBuilt = true;
          const mount = entry.target.querySelector('[data-chapter-micro="diptych"]');
          if(mount) mount.innerHTML = renderCorrespondenceGrid();
          wireCorrespondenceGrid(entry.target);
        });
        return;
      }

      if(torn){
        torn = false;
        macro.restore();
      }
      macro.setLens(chapterId);
      decl.play(chapterId);
    });
  }, { threshold: [0.25] });

  root.querySelectorAll('.chapter-section').forEach(sec => observer.observe(sec));
}

function diptychMarkify(quote, highlights){
  let escaped = escapeHTML(quote);
  (highlights||[]).slice().sort((a,b)=>b.length-a.length).forEach(h=>{
    const eh = escapeHTML(h);
    if(escaped.indexOf(eh) === -1) return;
    escaped = escaped.replace(eh, `<mark>${eh}</mark>`);
  });
  return escaped;
}

function renderCorrespondenceGrid(){
  if(!DIPTYCH_PAIRS.length) return '<p class="corr-empty">No highlight pairs coded yet.</p>';
  return `
  <div class="diptych-wrap">
    <div class="diptych-legend mono" id="diptychLegend"></div>
    <div class="diptych-frame">
      <div class="diptych-frame-inner">
        <div class="diptych-stage">
          <svg id="diptychSvg" viewBox="0 0 880 560" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>
    </div>
    <div class="diptych-caption mono">Correspondences &middot; <em>1999 / 2025</em> &middot; sixteen panels, hinged at the center</div>
  </div>`;
}

function wireCorrespondenceGrid(root){
  const svgEl = root.querySelector('#diptychSvg');
  const legendEl = root.querySelector('#diptychLegend');
  if(!svgEl || !legendEl || typeof d3 === 'undefined') return;

  const tooltip = document.getElementById('diptychTooltip');
  const panel = document.getElementById('diptychPanel');

  /* same ordering rule as the prototype: group by family (largest family
     first), unattached pairs ("Other Cross-Era Echoes") pushed to the end,
     so index i always pairs the same row across both columns */
  const familyOrder = [...new Set(DIPTYCH_PAIRS.map(p=>p.familyLabel))].sort((a,b)=>{
    if(a === 'Other Cross-Era Echoes') return 1;
    if(b === 'Other Cross-Era Echoes') return -1;
    return DIPTYCH_PAIRS.filter(p=>p.familyLabel===b).length - DIPTYCH_PAIRS.filter(p=>p.familyLabel===a).length;
  });
  const ordered = familyOrder.flatMap(fam => DIPTYCH_PAIRS.filter(p=>p.familyLabel===fam));

  const N = ordered.length;
  const COLS = 4, ROWS = Math.ceil(N / COLS);

  function gridPos(i, x0, x1, y0, y1){
    const col = i % COLS, row = Math.floor(i / COLS);
    const cw = (x1 - x0) / COLS, rh = (y1 - y0) / ROWS;
    return { x: x0 + cw*(col+0.5), y: y0 + rh*(row+0.5) };
  }

  const LEFT  = {x0: 60,  x1: 350, y0: 90, y1: 500};
  const RIGHT = {x0: 530, x1: 820, y0: 90, y1: 500};

  const leftItems  = ordered.map((p,i) => Object.assign({side:'a', idx:i, pair:p}, p.a, gridPos(i, LEFT.x0, LEFT.x1, LEFT.y0, LEFT.y1)));
  const rightItems = ordered.map((p,i) => Object.assign({side:'b', idx:i, pair:p}, p.b, gridPos(i, RIGHT.x0, RIGHT.x1, RIGHT.y0, RIGHT.y1)));
  const allItems = leftItems.concat(rightItems);

  const svg = d3.select(svgEl);
  const layer = svg.append('g');

  svg.append('text').attr('class','diptych-col-label a').attr('x', (LEFT.x0+LEFT.x1)/2).attr('y', 50).attr('text-anchor','middle').text('1999');
  svg.append('text').attr('class','diptych-col-label b').attr('x', (RIGHT.x0+RIGHT.x1)/2).attr('y', 50).attr('text-anchor','middle').text('2025');

  /* the hinge itself — drawn once, sits behind the cells, spans the gutter between the two panels */
  (function drawHinge(){
    const midX = (LEFT.x1 + RIGHT.x0) / 2; // gutter center
    const hingeLayer = svg.insert('g', ':first-child').attr('class','diptych-hinge-layer');
    hingeLayer.append('line')
      .attr('class','diptych-hinge-line')
      .attr('x1', midX).attr('y1', LEFT.y0 - 20)
      .attr('x2', midX).attr('y2', LEFT.y1 + 20);
    [LEFT.y0 - 4, (LEFT.y0+LEFT.y1)/2, LEFT.y1 + 4].forEach(py => {
      hingeLayer.append('rect')
        .attr('class','diptych-hinge-plate')
        .attr('x', midX-9).attr('y', py-13).attr('width', 18).attr('height', 26).attr('rx', 3);
      hingeLayer.append('circle')
        .attr('class','diptych-hinge-pin')
        .attr('cx', midX).attr('cy', py).attr('r', 2.2);
    });
  })();

  const r = 14;
  const cellG = layer.selectAll('g.diptych-cell')
    .data(allItems)
    .join('g')
    .attr('class', 'diptych-cell')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .on('click', (event, d) => { event.stopPropagation(); pick(d.idx); });

  cellG.append('g')
    .attr('class','diptych-bob')
    .style('--bob-dur', () => (4 + Math.random()*3).toFixed(2)+'s')
    .style('--bob-delay', () => (Math.random()*3).toFixed(2)+'s')
    .style('--bob-dx', () => (Math.random()*3-1.5).toFixed(1)+'px')
    .style('--bob-dy', () => (Math.random()*3-1.5).toFixed(1)+'px')
    .append('circle')
    .attr('class', d => 'core ' + d.side)
    .attr('r', r);

  cellG
    .on('mousemove', (event, d) => {
      tooltip.innerHTML = `<span class="t-year ${d.side}">${d.year}</span> &middot; ${escapeHTML(d.author)}<br>${escapeHTML(d.title)}`;
      tooltip.style.left = (event.clientX + 14) + 'px';
      tooltip.style.top = (event.clientY + 10) + 'px';
      tooltip.classList.add('show');
    })
    .on('mouseleave', () => tooltip.classList.remove('show'));

  const connectorLayer = layer.append('g').attr('class','diptych-connector-layer');

  /* family legend / filter */
  let activeFamily = null;
  familyOrder.forEach(fam => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = fam;
    btn.addEventListener('click', (e) => { e.stopPropagation(); toggleFamily(fam, btn); });
    legendEl.appendChild(btn);
  });

  function toggleFamily(fam, btn){
    clearPick();
    [...legendEl.children].forEach(b => b.classList.remove('active'));
    if(activeFamily === fam){ activeFamily = null; cellG.classed('diptych-is-dimmed', false); return; }
    activeFamily = fam;
    btn.classList.add('active');
    cellG.classed('diptych-is-dimmed', d => d.pair.familyLabel !== fam);
  }

  function clearPick(){
    cellG.classed('diptych-is-dimmed', false).classed('diptych-is-picked', false);
    connectorLayer.selectAll('*').remove();
    closePanel();
  }

  function pick(idx){
    [...legendEl.children].forEach(b => b.classList.remove('active'));
    activeFamily = null;

    cellG.classed('diptych-is-dimmed', d => d.idx !== idx)
         .classed('diptych-is-picked', d => d.idx === idx);

    connectorLayer.selectAll('*').remove();
    const a = leftItems[idx], b = rightItems[idx];
    const mx = (a.x + b.x) / 2;
    const path = `M ${a.x} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`;
    connectorLayer.append('path').attr('class','diptych-connector-line').attr('d', path);
    connectorLayer.append('circle').attr('class','diptych-connector-dot').attr('cx',a.x).attr('cy',a.y).attr('r',2.4).attr('fill','var(--amber)');
    connectorLayer.append('circle').attr('class','diptych-connector-dot').attr('cx',b.x).attr('cy',b.y).attr('r',2.4).attr('fill','var(--turq)');

    openPanel(ordered[idx]);
  }

  svg.on('click', clearPick);

  /* detail panel */
  function pcardHTML(side, cls){
    return `<div class="diptych-pcard ${cls}">
      <div class="yr">${escapeHTML(side.year)}</div>
      <p class="quote">${diptychMarkify(side.quote, side.highlights)}</p>
      <div class="meta"><span class="title">${escapeHTML(side.title)}</span> &middot; ${escapeHTML(side.author)}</div>
    </div>`;
  }
  function openPanel(pair){
    document.getElementById('diptychPanelFamily').textContent = pair.familyLabel;
    document.getElementById('diptychPanelMotif').textContent = pair.motifLabel ? pair.motifLabel.replace(/^"|"$/g,'') : '';
    document.getElementById('diptychPanelCards').innerHTML = pcardHTML(pair.a,'col-1999') + pcardHTML(pair.b,'col-2025');
    panel.classList.add('open');
  }
  function closePanel(){ panel.classList.remove('open'); }

  document.getElementById('diptychPanelClose').addEventListener('click', (e)=>{ e.stopPropagation(); clearPick(); });
}

/* =========================================================================
   BUBBLE INTRO — teaches the fragment/year color grammar before the
   prologue text appears. Plays once per browser session.
   ========================================================================= */
const BP_SESSION_KEY = 'bp_bubbleIntroSeen';

function renderBubbleIntro(){
  return `
  <div class="bubble-intro" id="bubbleIntro" tabindex="0"
       aria-label="Introductory sequence. Click, tap, or press space to continue.">
    <button class="skip mono" id="bpSkip" type="button">Skip intro</button>
    <div class="bubble-field">
      <div class="bp-bubble primary" id="bpPrimary" data-color="neutral"></div>
      <div class="bp-bubble secondary" id="bpSecondary"></div>
    </div>
    <p class="bp-caption" id="bpCaption"></p>
    <div class="bp-progress" id="bpProgress"></div>
  </div>`;
}

function wireBubbleIntro(app){
  const intro = app.querySelector('#bubbleIntro');
  const prologueContent = app.querySelector('#prologueContent');
  if(!intro || !prologueContent) return;

  const alreadySeen = sessionStorage.getItem(BP_SESSION_KEY) === '1';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(alreadySeen){
    intro.remove();
    prologueContent.classList.add('show');
    return;
  }

  // Lock scroll while the intro is playing — otherwise a reader can scroll straight
  // past it before the sequence (or the skip button) has run. Locks BOTH body and
  // .spine-scroll: the prologue/chapters now scroll inside their own nested
  // .spine-scroll container (see the html{} comment in <style> for why), which is
  // an independent scroll context from body — locking only body's overflow would
  // leave .spine-scroll itself still scrollable via wheel/touch while the intro plays.
  // Released in complete(), the only path out of the intro.
  const spineScroll = app.querySelector('.spine-scroll');
  document.body.style.overflow = 'hidden';
  if(spineScroll) spineScroll.style.overflow = 'hidden';

  // Set to false to drop the "echo" beat — everything else still works.
  const INCLUDE_CONNECTION_BEAT = true;

  const beats = [
    { color:'neutral', text:'', silent:true, duration:1200 },
    { color:'neutral', text:'This is a fragment of a news story published in the New York Times Editorial Desk.' },
    { color:'amber', text:'This means it was published in 1999 — during the internet boom.' },
    { color:'turq', text:'This means it was published in 2025 — during the AI boom.' },
  ];
  if(INCLUDE_CONNECTION_BEAT){
    beats.push({ color:'connection', text:'Sometimes, a fragment from one year echoes another.' });
  }
  beats.push({ color:'turq', text:'You’ll meet hundreds of these.', final:true });

  const primary = intro.querySelector('#bpPrimary');
  const secondary = intro.querySelector('#bpSecondary');
  const caption = intro.querySelector('#bpCaption');
  const progress = intro.querySelector('#bpProgress');
  const skipBtn = intro.querySelector('#bpSkip');

  const visibleBeats = beats.filter(b=>!b.silent);
  visibleBeats.forEach(()=> progress.appendChild(document.createElement('span')));

  let index = 0, timer = null;

  function showBeat(i){
    const beat = beats[i];
    if(beat.color === 'connection'){
      primary.dataset.color = 'amber';
      primary.classList.add('paired');
      secondary.dataset.color = 'turq';
      secondary.classList.add('show');
    } else {
      primary.dataset.color = beat.color;
      primary.classList.remove('paired');
      secondary.classList.remove('show');
    }
    caption.classList.remove('show');
    setTimeout(()=>{
      caption.textContent = beat.text;
      if(beat.text) caption.classList.add('show');
    }, beat.silent ? 0 : 200);

    const dots = [...progress.children];
    const vIdx = beats.slice(0,i+1).filter(b=>!b.silent).length - 1;
    dots.forEach((d,di)=> d.classList.toggle('active', di===vIdx));

    clearTimeout(timer);
    if(!beat.final){
      timer = setTimeout(advance, reduced ? 200 : (beat.duration || 3600));
    }
  }

  function advance(){
    if(index >= beats.length - 1){ complete(); return; }
    index += 1;
    showBeat(index);
  }

  function complete(){
    clearTimeout(timer);
    sessionStorage.setItem(BP_SESSION_KEY, '1');
    document.body.style.overflow = '';
    if(spineScroll) spineScroll.style.overflow = '';
    intro.style.transition = 'opacity .7s ease';
    intro.style.opacity = '0';
    setTimeout(()=>{
      intro.remove();
      prologueContent.classList.add('show');
    }, reduced ? 0 : 700);
  }

  if(reduced){ complete(); return; }

  intro.addEventListener('click', advance);
  intro.addEventListener('keydown', (e)=>{
    if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); advance(); }
  });
  skipBtn.addEventListener('click', (e)=>{ e.stopPropagation(); complete(); });

  showBeat(0);
}

function renderBiography(){
  const parts = [];
  // Prologue + the chapter spine share one nested scroll container (.spine-scroll)
  // with its own mandatory snap, separate from the page's normal scroll. This is
  // what actually fixes the trap bug that kept resurfacing: scroll-snap-type was
  // previously declared on <html>, the SAME container the whole page (Metaphors,
  // footer, everything) scrolls in — mandatory snapping there is forced to always
  // rest on a snap point, so it kept trapping the reader wherever the last snap
  // target happened to be (first Diptych, then Metaphors, moving every time
  // something free-scrolling was appended after it). Scoping mandatory snap to
  // its own finite, one-viewport-tall container sidesteps that permanently: once
  // the reader scrolls past this container's last snap point (Diptych), they've
  // simply reached the end of ITS scrollable content, and the browser hands off
  // to the outer page's normal (unsnapped) scroll on its own — no "next snap
  // target" needed, and no possible trap.
  parts.push(`<div class="spine-scroll">
  <section class="prologue">
    ${renderBubbleIntro()}
    <div class="prologue-content" id="prologueContent">
      <div class="eyebrow">A Biography of two technologies</div>
      <h1>Biography of the Bubbles</h1>
      <p class="sub">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua, ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
      <div class="authorial">[Lorem ipsum dolor sit amet]<br><em>Prologue — Threshold.</em> Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</div>
      <div class="scrolldown">begin the descent &darr;</div>
    </div>
  </section>

  ${renderChapters()}
  </div>`);

  // Metaphors was previously its own tab; folded in here as a second section of the same
  // page, right before the credit footer, rather than a page transition — renderMetaphorsBody
  // deliberately omits its own hero/footer so the two don't stack inside one page. Lives
  // outside .spine-scroll now, in the page's normal free-scroll flow.
  parts.push(`<div class="chapter-head section-divider">
    <div class="eyebrow"><span class="prov">an imagery of technologies</span></div>
    <h2>Metaphors</h2>
    <div class="count">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</div>
  </div>`);
  parts.push(renderMetaphorsBody());

  return parts.join('');
}
