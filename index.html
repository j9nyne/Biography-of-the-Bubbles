// The mythic voice is derived from source_image itself ("a sacred, quasi-mythical
// object of quest" -> "I am a sacred, quasi-mythical object of quest."), not a
// separately hand-written field. Cards whose source_image is missing fall back
// to a plain .metacard flagged for later curation.
function mythicVoiceFromSourceImage(sourceImage){
  if(!sourceImage) return null;
  const s = sourceImage.trim();
  const body = s.charAt(0).toLowerCase() + s.slice(1);
  return `I am ${body}.`;
}

function metaphorArticle(m){
  return allArticles().find(a => (a.metaphor_ids||[]).includes(m.id));
}

function metaphorCountsByYearAndCluster(){
  const counts = {}; // counts[cluster] = {'1999':n,'2025':n}
  Object.values(DATA.metaphors).forEach(m=>{
    const art = metaphorArticle(m);
    if(!art) return;
    counts[m.cluster] = counts[m.cluster] || {'1999':0,'2025':0};
    counts[m.cluster][art.year] = (counts[m.cluster][art.year]||0) + 1;
  });
  return counts;
}

function metaphorsByClusterAndYear(cluster, year){
  return Object.values(DATA.metaphors).filter(m=>{
    if(m.cluster !== cluster) return false;
    const art = metaphorArticle(m);
    return art && art.year === year;
  });
}

// Deck stacking: only the next few cards behind the top show a sliver of
// edge/rotation, so it reads as a deck of cards, not a fan. Anything deeper
// than that sits pinned directly under the visible stack (no growing offset).
const DECK_VISIBLE_DEPTH = 3;
const DECK_STEP_PX = 5;
const DECK_STEP_DEG = 1.6;
function deckOffsetStyle(i){
  const depth = Math.min(i, DECK_VISIBLE_DEPTH);
  const sign = (i%2?1:-1);
  const rot = i===0 ? 0 : sign*DECK_STEP_DEG*depth;
  const dx = depth*DECK_STEP_PX*0.6;
  const dy = depth*DECK_STEP_PX;
  return `transform:rotate(${rot}deg) translate(${dx}px, ${dy}px); z-index:${1000-i};`;
}

// Fallback card — used only when source_image is missing. Janyne flags these
// herself later; nothing here is invented to fill the gap.
function metacardHTML(m, i){
  const art = metaphorArticle(m);
  const style = deckOffsetStyle(i);
  return `<article class="metacard" data-metaphor-id="${escapeHTML(m.id)}" style="${style}">
    <span class="no-image-flag">no source_image coded</span>
    <div class="subject">${escapeHTML(m.metaphor_trigger)}</div>
    <div class="meta">
      ${art ? `<a href="#article/${art.id}" data-nav-article="${art.id}">${escapeHTML(art.title)}</a> &middot; ${escapeHTML(authorLabel(art.author_id))} &middot; ${escapeHTML(art.year)}` : ''}
      &middot; ${escapeHTML(metaphorLabel(m.cluster))}
    </div>
  </article>`;
}

// Bestiary flip-card. Front: the creature speaking in first person, derived
// from source_image, tarot-card treatment. Back: the verbatim passage as a
// specimen label / field report proving the creature exists in the corpus.
// Flip is triggered by click/hover on the card, not scroll — this is the
// argument itself (myth first, then the journalism underneath it), so the
// reader has to act on the card to get from one to the other.
function beastcardHTML(m, i){
  const art = metaphorArticle(m);
  const voice = mythicVoiceFromSourceImage(m.source_image);
  const style = `z-index:${1000-i};`;
  return `<article class="beastcard" data-metaphor-id="${escapeHTML(m.id)}" data-flipped="0" style="${style}">
    <div class="beastcard-inner">
      <div class="beastcard-face beastcard-front">
        <div class="beastcard-tag">${escapeHTML(metaphorLabel(m.cluster))}</div>
        <div class="beastcard-voice">${escapeHTML(voice)}</div>
        <div class="beastcard-hint">tap to see the source &darr;</div>
      </div>
      <div class="beastcard-face beastcard-back">
        <div class="specimen-tag">Field report &middot; sighting confirmed</div>
        <p class="specimen-quote">${escapeHTML(m.passage)}</p>
        <div class="meta">${art ? `<a href="#article/${art.id}" data-nav-article="${art.id}">${escapeHTML(art.title)}</a> &middot; ${escapeHTML(authorLabel(art.author_id))} &middot; ${escapeHTML(art.year)}` : ''}</div>
      </div>
    </div>
  </article>`;
}

function metadeckHTML(cluster, year){
  const items = seededShuffle(metaphorsByClusterAndYear(cluster, year), CHAPTER_SEED + cluster.charCodeAt(2) + (year==='1999'?1:2));
  if(!items.length) return `<div class="metadeck"><p class="pending">none</p></div>`;

  const cardsHTML = items.map((m,i)=> m.source_image ? beastcardHTML(m,i) : metacardHTML(m,i)).join('');

  return `<div class="metadeck" data-cluster="${cluster}" data-year="${year}">
    ${cardsHTML}
    ${items.length>1 ? `<div class="deck-hint">${items.length} in this deck — click the top card to flip, click a card edge to cycle</div>` : ''}
  </div>`;
}

const BUBBLE_INTERLUDE = {
  id:'bubble-metaphors',
  eyebrow:'Marginalia — the metaphor the thesis is named for',
  build(){
    const bubbleMs = Object.values(DATA.metaphors).filter(m=>m.is_bubble_metaphor);
    const c99 = bubbleMs.filter(m=>{ const a=metaphorArticle(m); return a && a.year==='1999'; }).length;
    const c25 = bubbleMs.filter(m=>{ const a=metaphorArticle(m); return a && a.year==='2025'; }).length;
    const total = Object.keys(DATA.metaphors).length;
    return `<div class="marginalia"><div class="m-eyebrow">${this.eyebrow}</div>
      <h3>The Bubble</h3>
      <p>Of <span class="m-stat">${total} metaphors</span> coded across the corpus, only
      <span class="m-stat">${bubbleMs.length}</span> are literal bubble/inflation figures —
      <span class="m-stat">${c99}</span> in 1999, <span class="m-stat">${c25}</span> in 2025.
      That is a small slice of the total figurative language, not the dominant pattern. It gives this
      project its title because it is thematically central to what a "bubble" means across both
      moments — not because it is the most common metaphor in the data.</p>
    </div>`;
  }
};

function metaphorCloseHTML(){
  const counts = metaphorCountsByYearAndCluster();
  const clusters = Object.keys(DATA.metaphor_categories);
  const segColors = ['b-sublime','b-demonic','b-paired','b-deflated','b-none']; // reused CSS hues, cycled
  const segStyle = ['var(--sublime)','var(--demonic)','var(--paired)','var(--deflated)','var(--turq)','var(--amber)','#8a6ea8','#4d7a7a'];

  function bar(year){
    const total = clusters.reduce((s,c)=> s + ((counts[c]||{})[year]||0), 0) || 1;
    return `<div class="regbar">${clusters.map((c,i)=>{
      const n = (counts[c]||{})[year]||0;
      if(!n) return '';
      return `<span style="width:${(n/total*100).toFixed(1)}%;background:${segStyle[i%segStyle.length]}" title="${escapeHTML(metaphorLabel(c))}: ${n}"></span>`;
    }).join('')}</div>`;
  }

  const legend = clusters.map((c,i)=>`<span><i style="background:${segStyle[i%segStyle.length]}"></i>${escapeHTML(metaphorLabel(c))}</span>`).join('');

  return `<div class="chapter-close metaphor-close-grid">
    <h3>Metaphor cluster balance — 1999 vs 2025 (recalculated live from ${Object.keys(DATA.metaphors).length} coded metaphors)</h3>
    <div class="close-grid">
      <div class="close-col c1999"><h4>1999</h4>${bar('1999')}</div>
      <div class="close-col c2025"><h4>2025</h4>${bar('2025')}</div>
    </div>
    <div class="mc-legend" style="justify-content:center;">${legend}</div>
  </div>`;
}

function renderMetaphorsBody(){
  const counts = metaphorCountsByYearAndCluster();
  const clusters = Object.keys(DATA.metaphor_categories);
  const ordered = clusters.slice().sort((a,b)=>{
    const da = Math.abs(((counts[a]||{})['2025']||0) - ((counts[a]||{})['1999']||0));
    const db = Math.abs(((counts[b]||{})['2025']||0) - ((counts[b]||{})['1999']||0));
    return db - da;
  });

  const parts = [];
  parts.push(`<div class="authorial section-intro">[Lorem ipsum dolor sit amet]<br><em>Metaphors.</em> Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.</div>`);

  ordered.forEach((cluster, idx)=>{
    parts.push(`<div class="metaphor-cluster" data-reveal>
      <div class="chapter-head">
        <h2>${escapeHTML(metaphorLabel(cluster))}</h2>
      </div>

      <div class="spine">
        <div class="col col-1999">
          <div class="col-label">1999</div>
          ${metadeckHTML(cluster, '1999')}
        </div>
        <div class="col col-2025">
          <div class="col-label">2025</div>
          ${metadeckHTML(cluster, '2025')}
        </div>
      </div>
    </div>`);

    // BUBBLE_INTERLUDE.build() already returns a complete .marginalia block (with
    // its own eyebrow + h3), unlike marginaliaHTML()'s usual contract of wrapping a
    // bare {eyebrow,title,build} — routing it through marginaliaHTML() double-wrapped
    // the markup and printed "undefined" for the h3 marginaliaHTML expected but
    // BUBBLE_INTERLUDE never defines.
    if(idx===0) parts.push(BUBBLE_INTERLUDE.build());
  });

  parts.push(`<div class="spine">${metaphorCloseHTML()}</div>`);

  return parts.join('');
}

function wireMetaphorDecks(){
  document.querySelectorAll('.metadeck').forEach(deck=>{
    // `order` is the current stacking order (front-to-back), kept in sync with every
    // cycle so a click can always tell whether it landed on today's top card — using
    // each card's original DOM index instead (fixed at wiring time) meant that after
    // the first cycle, clicking the card that now visually sits on top would run
    // whatever branch its *original* index dictated, not the one matching what's
    // on screen: clicks on the true top card silently re-cycled instead of flipping,
    // so flipping stopped working, which read as cards going dead / never revealing
    // their source passage.
    let cards = Array.from(deck.children).filter(c=>c.classList.contains('metacard')||c.classList.contains('beastcard'));
    let order = cards.map((c,i)=>i);

    function applyOrder(){
      order.forEach((origIdx,newPos)=>{
        const el = cards[origIdx];
        const depth = Math.min(newPos, DECK_VISIBLE_DEPTH);
        const sign = (newPos%2?1:-1);
        const rot = newPos===0 ? 0 : sign*DECK_STEP_DEG*depth;
        const dx = depth*DECK_STEP_PX*0.6;
        const dy = depth*DECK_STEP_PX;
        el.style.zIndex = 1000-newPos;
        el.style.transform = `rotate(${rot}deg) translate(${dx}px, ${dy}px)`;
      });
    }

    function cycleTo(origIdx){
      const pos = order.indexOf(origIdx);
      if(pos <= 0) return; // already the top card — handled by flip, not cycling
      order = order.slice(pos).concat(order.slice(0,pos));
      applyOrder();
    }

    cards.forEach((card,origIdx)=>{
      card.addEventListener('click', (e)=>{
        if(e.target.closest('a')) return;
        const isTop = order[0] === origIdx;
        if(isTop && card.classList.contains('beastcard')){
          card.setAttribute('data-flipped', card.getAttribute('data-flipped')==='1' ? '0' : '1');
          return;
        }
        cycleTo(origIdx);
      });
    });
  });
}

/* fades/lifts each [data-reveal] element (currently: the Metaphors
   subcategories) into place as the reader scrolls to it. One-shot per
   element — once revealed it stays visible, so scrolling back up doesn't
   re-hide content the reader already saw. Falls back to revealing
   everything immediately if IntersectionObserver isn't available, so
   content is never stuck invisible. */
function wireScrollReveal(root){
  const targets = root.querySelectorAll('[data-reveal]');
  if(!targets.length) return;

  if(typeof IntersectionObserver === 'undefined'){
    targets.forEach(el => el.classList.add('is-visible'));
    return;
  }

  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -10% 0px' });

  targets.forEach(el => observer.observe(el));
}

/* =========================================================================
   6. LAYER 2 — EVIDENCE (filterable browser)
   ========================================================================= */
const FILTER_DIMS = [
  {key:'era', label:'Era', get:(f,a)=>[a?a.year:null]},
  {key:'author', label:'Author', get:(f,a)=>[a?a.author_id:null], labelFn:authorLabel},
  {key:'company', label:'Company', get:(f,a)=>a?a.company_ids:[], labelFn:id=>(company(id)||{}).label||id},
  {key:'myth', label:'Myth', get:(f)=>getMyths(f).map(m=>m.narrative), labelFn:id=>(myth(id)||{}).label||id},
  {key:'subtheme', label:'Subtheme', get:(f)=>getMyths(f).map(m=>m.subtheme).filter(Boolean)},
  {key:'register', label:'Register', get:(f)=>getMyths(f).map(m=>m.stance==='deflated'?'deflated':m.register).filter(Boolean)},
  {key:'stance', label:'Stance', get:(f)=>getMyths(f).map(m=>m.stance)},
  {key:'metaphor', label:'Metaphor category', get:(f,a)=>a?a.metaphor_category_ids:[], labelFn:metaphorLabel},
  {key:'keyword', label:'Keyword', get:(f)=>f.keywords||[], labelFn:keywordLabel, searchable:true},
  {key:'topic', label:'Topic', get:(f,a)=>a?[a.topic_primary,a.topic_secondary].filter(Boolean):[], labelFn:topicLabel},
  {key:'peters', label:'Peters stage', get:(f,a)=>a?[a.peters_primary].concat(a.peters_secondary||[]):[], labelFn:peterLabel},
  {key:'authorvoice', label:'Author voice', get:(f,a)=>a?(authorOf(a)||{}).professions||[]:[], labelFn:voiceLabel},
  {key:'quotedvoice', label:'Quoted voices', get:(f,a)=>a?a.quoted_voices:[], labelFn:voiceLabel},
  {key:'authorshiptype', label:'Authorship type', get:(f,a)=>a?[(authorOf(a)||{}).authorship_type||'uncoded']:['uncoded']}
];

let activeFilters = {}; // key -> Set of values

function parseFiltersFromURL(){
  activeFilters = {};
  const params = new URLSearchParams(location.hash.split('?')[1]||'');
  FILTER_DIMS.forEach(d=>{
    const v = params.get(d.key);
    if(v) activeFilters[d.key] = new Set(v.split(','));
  });
}
function filtersToURL(){
  const params = new URLSearchParams();
  Object.keys(activeFilters).forEach(k=>{
    if(activeFilters[k] && activeFilters[k].size) params.set(k, Array.from(activeFilters[k]).join(','));
  });
  const qs = params.toString();
  const base = '#evidence';
  history.replaceState(null,'', base + (qs?('?'+qs):''));
}

function fragmentMatchesFilters(f){
  const a = article(f.article_id);
  return FILTER_DIMS.every(d=>{
    const sel = activeFilters[d.key];
    if(!sel || !sel.size) return true;
    const vals = d.get(f,a) || [];
    return vals.some(v=>sel.has(String(v)));
  });
}

function buildFilterOptions(){
  return FILTER_DIMS.map(d=>{
    const counts = {};
    allFragments().forEach(f=>{
      const a = article(f.article_id);
      (d.get(f,a)||[]).forEach(v=>{ if(v!=null){ counts[v]=(counts[v]||0)+1; } });
    });
    let entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    return {dim:d, entries};
  });
}

const SEARCHABLE_VISIBLE_DEFAULT = 12;

function renderEvidence(){
  const opts = buildFilterOptions();
  const filtersHTML = opts.map(({dim,entries})=>{
    if(!entries.length) return '';
    const activeVals = activeFilters[dim.key] || new Set();
    const rows = entries.map(([val,count])=>{
      const checked = activeVals.has(val) ? 'checked' : '';
      const lbl = dim.labelFn ? dim.labelFn(val) : val;
      const hideByDefault = dim.searchable && !checked && entries.findIndex(e=>e[0]===val) >= SEARCHABLE_VISIBLE_DEFAULT;
      return `<label data-search-text="${escapeHTML(String(lbl).toLowerCase())}" ${hideByDefault?'style="display:none" data-hidden-overflow="1"':''}>
        <input type="checkbox" data-dim="${dim.key}" value="${escapeHTML(val)}" ${checked}> ${escapeHTML(lbl)} <span class="filter-count">(${count})</span>
      </label>`;
    }).join('');
    const searchBox = dim.searchable
      ? `<input type="text" class="filter-search" data-search-for="${dim.key}" placeholder="search ${entries.length} keywords…">`
      : '';
    const overflowCount = dim.searchable ? Math.max(0, entries.length - SEARCHABLE_VISIBLE_DEFAULT) : 0;
    const showAllBtn = overflowCount
      ? `<button class="show-all-filter" data-show-all-for="${dim.key}">+ ${overflowCount} more</button>` : '';
    return `<div class="filter-group" data-filter-group="${dim.key}"><h4>${dim.label}</h4>${searchBox}${rows}${showAllBtn}</div>`;
  }).join('');

  return `<div class="evidence-shell">
    <div class="filters">
      <h4 style="margin-top:0;">Filters</h4>
      ${filtersHTML}
      <button class="clear-filters" id="clear-filters-btn">Clear all filters</button>
    </div>
    <div class="results" id="evidence-results"></div>
  </div>`;
}

function renderEvidenceResults(){
  const container = document.getElementById('evidence-results');
  if(!container) return;
  const matched = allFragments().filter(fragmentMatchesFilters);
  const total = allFragments().length;
  const noMythPct = Math.round(100 * allFragments().filter(f=>!getMyths(f).length).length / total);

  // Group matched fragments by article, then sort the groups chronologically by the
  // article's own date field (YYYY-MM-DD, string-sortable as-is). Only fragments that pass
  // the active filters appear inside a given article's group — an article shows up at all
  // only if at least one of its fragments matches.
  const byArticle = {};
  matched.forEach(f=>{
    (byArticle[f.article_id] = byArticle[f.article_id] || []).push(f);
  });
  const articleGroups = Object.keys(byArticle).map(articleId=>({
    art: article(articleId), frags: byArticle[articleId]
  })).sort((a,b)=>{
    const da = a.art ? a.art.date : '';
    const db = b.art ? b.art.date : '';
    return da < db ? -1 : da > db ? 1 : 0;
  });

  const groupsHTML = articleGroups.map(({art,frags})=>{
    const yearCls = art ? ('y'+art.year) : '';
    const articleMyths = art ? getMyths(art) : [];
    const badges = articleMyths.map(registerBadgeHTML).join('');
    const metaChips = [
      art && art.topic_primary ? `<span class="eg-chip">${escapeHTML(topicLabel(art.topic_primary))}</span>` : '',
      art ? `<span class="eg-chip eg-chip-author">${escapeHTML(authorLabel(art.author_id))}</span>` : ''
    ].join('');
    return `<details class="evidence-group ${yearCls}">
      <summary>
        <div class="eg-summary-top">
          <span class="eg-date">${art ? escapeHTML(art.date||art.year) : ''}</span>
          <span class="eg-count">${frags.length} fragment${frags.length===1?'':'s'}</span>
        </div>
        <div class="eg-title">${art ? escapeHTML(art.title) : 'Unknown article'}</div>
        ${badges || metaChips ? `<div class="eg-tags">${badges}${metaChips}</div>` : ''}
      </summary>
      <div class="eg-body">
        ${frags.map(f=>{
          const myths = getMyths(f);
          const regLbl = myths.length ? myths.map(m=>m.stance==='deflated'?'deflated':m.register).join(', ') : '—';
          return `<div class="result-row" data-open-frag="${f.id}">
            <div class="rtext">${escapeHTML((f.quotation||'').slice(0,140))}${f.quotation && f.quotation.length>140?'…':''}</div>
            <div class="rreg">${escapeHTML(regLbl)}</div>
          </div>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');

  container.innerHTML = `<div class="results-count">${matched.length} of ${total} fragments match, across ${articleGroups.length} article${articleGroups.length===1?'':'s'} (${noMythPct}% of all fragments carry no myth coding — filtering by myth will always exclude most of the corpus)</div>`
    + groupsHTML;

  container.querySelectorAll('[data-open-frag]').forEach(row=>{
    row.addEventListener('click', (e)=>{
      e.stopPropagation();
      openFragmentOverlay(row.getAttribute('data-open-frag'));
    });
  });
}

function wireEvidenceFilters(){
  document.querySelectorAll('[data-dim]').forEach(input=>{
    input.addEventListener('change', ()=>{
      const dim = input.getAttribute('data-dim');
      const val = input.value;
      if(!activeFilters[dim]) activeFilters[dim] = new Set();
      if(input.checked) activeFilters[dim].add(val); else activeFilters[dim].delete(val);
      if(!activeFilters[dim].size) delete activeFilters[dim];
      filtersToURL();
      renderEvidenceResults();
    });
  });
  const clearBtn = document.getElementById('clear-filters-btn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    activeFilters = {};
    filtersToURL();
    document.getElementById('app').innerHTML = renderEvidence();
    wireEvidenceFilters();
    renderEvidenceResults();
  });

  document.querySelectorAll('[data-show-all-for]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const group = btn.closest('.filter-group');
      group.querySelectorAll('label[data-hidden-overflow]').forEach(l=>{ l.style.display=''; });
      btn.remove();
    });
  });

  document.querySelectorAll('[data-search-for]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const group = input.closest('.filter-group');
      const q = input.value.trim().toLowerCase();
      const showAllBtn = group.querySelector('[data-show-all-for]');
      group.querySelectorAll('label[data-search-text]').forEach(label=>{
        const match = !q || label.getAttribute('data-search-text').indexOf(q) !== -1;
        // while searching, ignore the "hidden by default" overflow flag entirely
        label.style.display = match ? '' : 'none';
      });
      if(showAllBtn) showAllBtn.style.display = q ? 'none' : '';
    });
  });
}

function openFragmentOverlay(fragId){
  const f = fragment(fragId);
  if(!f) return;

  // if this is a split fragment, get all siblings
  let content = fragmentCardHTML(f);
  if(f.split_from){
    const allFrags = allFragments();
    const siblings = allFrags.filter(sf => sf.split_from === f.split_from);
    const idx = siblings.findIndex(sf => sf.id === f.id);
    if(siblings.length > 1){
      const prev = idx > 0 ? siblings[idx-1] : null;
      const next = idx < siblings.length-1 ? siblings[idx+1] : null;
      content = `<div class="split-nav">`;
      if(prev){
        content += `<div class="split-shadow prev" data-nav-frag="${prev.id}"><span class="split-label">← Previous</span><p>${escapeHTML(prev.quotation.slice(0,100))}${prev.quotation.length>100?'…':''}</p></div>`;
      }
      content += `<div class="split-center">${fragmentCardHTML(f)}</div>`;
      if(next){
        content += `<div class="split-shadow next" data-nav-frag="${next.id}"><span class="split-label">Next →</span><p>${escapeHTML(next.quotation.slice(0,100))}${next.quotation.length>100?'…':''}</p></div>`;
      }
      content += `</div>`;
    }
  }

  document.getElementById('overlay-content').innerHTML = content;
  wireFragmentCardInteractions(document.getElementById('overlay-content'));

  // wire split nav clicks
  document.querySelectorAll('.split-shadow[data-nav-frag]').forEach(el=>{
    el.addEventListener('click', ()=>{
      openFragmentOverlay(el.getAttribute('data-nav-frag'));
    });
  });

  document.getElementById('frag-overlay').classList.add('open');
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('overlay-close-btn').addEventListener('click', ()=>{
    document.getElementById('frag-overlay').classList.remove('open');
  });
  document.getElementById('frag-overlay').addEventListener('click', (e)=>{
    if(e.target.id==='frag-overlay') document.getElementById('frag-overlay').classList.remove('open');
  });
});

/* article page */
function renderArticlePage(id){
  const a = article(id);
  if(!a) return `<p class="pending">Article not found.</p>`;
  const frags = fragmentsOfArticle(a);

let graphSimulation = null;

const EDGE_TYPE_LABELS = {
  same_article:'Same article', same_author:'Same author', same_company:'Same company',
  same_myth:'Same myth', same_article_myth:'Article myth (inherited)', same_topic:'Same topic', same_subtheme:'Same subtheme',

};

// Fixed color per edge type — same_article/same_metaphor/keyword already had one;
// the six former "Structural" sub-types get their own hue here so toggling a single
// dimension on/off in the UI reads as a distinct color disappearing from the canvas.
const EDGE_TYPE_COLORS = {
  same_article:'#9b7fd4',
  same_author:'#5ec9c9',
  same_company:'#e0a94e',
  same_myth:'#c9556b',
  // Same family as same_myth (both are "myth" edges) but darker/desaturated — this edge is
  // the article's inherited climate, not the fragment's own claim, so it reads as weaker.
  same_article_myth:'#8a5252',
  same_topic:'#6a9fd8',
  same_subtheme:'#8a6ea8',
  same_register:'#5f9e6a',
  same_metaphor:'#d88fb0',
};

// Myth compass mode: an optional positional force that pulls each fragment toward one of
// four fixed poles by which myth narrative it carries, instead of letting position emerge
// purely from connection physics. Angles in standard math convention (0°=east, going
// counter-clockwise) but we only ever use N/E/S/W, so it doesn't matter which convention —
// what matters is these four points are 90° apart around the canvas center.
const MYTH_COMPASS = {
  eoh:  {label:'End of History',   pole:'N', angle:-90},
  eop:  {label:'End of Politics',  pole:'E', angle:0},
  ehum: {label:'End of Humanity',  pole:'S', angle:90},
  eog:  {label:'End of Geography', pole:'W', angle:180},
};

function buildGraphData(opts){
  opts = opts || {};
  const nodes = allFragments().map(f=>{
    const a = article(f.article_id);
    const myths = getMyths(f);
    return {
      id:f.id, frag:f, article:a,
      year: a?a.year:null,
      register: myths.length ? (myths[0].stance==='deflated'?'deflated':myths[0].register) : null,
      degree:0
    };
  });
  const nodeIndex = {}; nodes.forEach(n=>nodeIndex[n.id]=n);
  const links = [];

  function addLink(s,t,type,label){
    if(s===t) return;
    links.push({source:s,target:t,type,label});
  }

  // Applied to every group regardless of size — capping only groups above a size threshold
  // (an earlier approach) still let dozens of small-to-mid groups each contribute a full
  // clique, which is how 9 summed dimensions reached ~10.7k <line> elements and made every
  // click sluggish (SVG line count is a real DOM-node cost, independent of whether anything
  // is animating). A flat per-group cap keeps every dimension's contribution small.
  //
  // The cap itself scales with how many edge dimensions are turned on at once, instead of
  // being one fixed number. With all 9 dimensions on, 8/group keeps the graph legible and
  // fast (~2.5k lines total). But isolating a single dimension (e.g. clicking "only" on
  // "Same myth") at that same cap=8 throws away 99%+ of that dimension's real connections —
  // same_myth alone has only 4 groups covering the whole corpus, so cap=8 draws a nearly
  // uniform, undifferentiated graph with no size/density variation to read. cap = 100 /
  // (active dimensions) means one isolated dimension gets a much richer sample (cap≈100)
  // while 9-at-once still converges to the known-good cap≈11.
  const activeDimCount = Math.max(1,
    (opts.sameArticle !== false ? 1 : 0) +
    Object.values(opts.structural || {same_author:true,same_company:true,same_myth:true,same_article_myth:true,same_topic:true,same_subtheme:true,same_register:true,same_metaphor:true}).filter(Boolean).length +
    (opts.keywords ? 1 : 0)
  );
  const MAX_EDGES_PER_GROUP = Math.round(100 / activeDimCount);
  function cliqueOrSample(ids, type, label){
    const full = ids.length*(ids.length-1)/2;
    if(full <= MAX_EDGES_PER_GROUP){
      for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) addLink(ids[i],ids[j],type,label);
      return;
    }
    let added = 0;
    outer:
    for(let k=1;k<ids.length;k++){
      for(let i=0;i<ids.length;i++){
        if(added >= MAX_EDGES_PER_GROUP) break outer;
        addLink(ids[i], ids[(i+k)%ids.length], type, label);
        added++;
      }
    }
  }

  if(opts.sameArticle !== false){
    const byArticle = {};
    allFragments().forEach(f=>{ (byArticle[f.article_id]=byArticle[f.article_id]||[]).push(f.id); });
    // label = the article's own title, so a clicked same-article line's constellation is
    // scoped to that one article's fragments, not every same_article link in the graph.
    Object.entries(byArticle).forEach(([articleId,ids])=>{
      const a = article(articleId);
      cliqueOrSample(ids, 'same_article', a ? a.title : articleId);
    });
  }

  // structural edges: group fragments by article-level attribute, then connect fragments across those articles.
  // Each dimension is toggled independently in the UI (see EDGE_TYPE_LABELS) rather than as one
  // combined "structural" switch, so a reader can isolate e.g. same-author connections alone.
  const structRules = opts.structural || {same_author:true,same_company:true,same_myth:true,same_article_myth:true,same_topic:true,same_subtheme:true,same_register:true,same_metaphor:true};
  function groupAndLink(keyFn, type, labelFn){
    const groups = {};
    allFragments().forEach(f=>{
      const a = article(f.article_id);
      const keys = keyFn(f,a);
      keys.forEach(k=>{ if(k==null) return; (groups[type+'::'+k] = groups[type+'::'+k]||[]).push(f.id); });
    });
    Object.keys(groups).forEach(groupKey=>{
      const ids = groups[groupKey];
      const rawKey = groupKey.slice(type.length+2);
      const label = labelFn ? labelFn(rawKey) : rawKey;
      cliqueOrSample(ids, type, label);
    });
  }
  if(structRules.same_author) groupAndLink((f,a)=>a?[a.author_id]:[], 'same_author', authorLabel);
  if(structRules.same_company) groupAndLink((f,a)=>a?a.company_ids:[], 'same_company', id=>(company(id)||{}).label||id);
  if(structRules.same_myth) groupAndLink((f)=>getMyths(f).map(m=>m.narrative), 'same_myth', id=>(myth(id)||{}).label||id);
  // Article myth: connects every fragment in an article that carries a given myth, by the
  // ARTICLE's own myth_ids rather than the fragment's. Deliberately includes fragments that
  // also have that myth directly (overlapping with same_myth when both are on) — this
  // dimension's point is to show the article's total mythic "climate," not just the subset
  // of fragments making the claim explicitly. Fragments with no myth of their own but sitting
  // inside a myth-carrying article (231 of 473 — nearly half the corpus) only ever surface
  // through this edge, never through same_myth.
  if(structRules.same_article_myth) groupAndLink((f,a)=>getMyths(a).map(m=>m.narrative), 'same_article_myth', id=>(myth(id)||{}).label||id);
  if(structRules.same_topic) groupAndLink((f,a)=>a?[a.topic_primary]:[], 'same_topic', topicLabel);
  if(structRules.same_subtheme) groupAndLink((f)=>getMyths(f).map(m=>m.subtheme).filter(Boolean), 'same_subtheme');
  if(structRules.same_register) groupAndLink((f)=>getMyths(f).map(m=>m.stance==='deflated'?'deflated':m.register).filter(Boolean), 'same_register');
  if(structRules.same_metaphor) groupAndLink((f,a)=>a?a.metaphor_category_ids:[], 'same_metaphor', metaphorLabel);

  // thematic (keyword) edges — direct structural links between fragments sharing an
  // exact keyword tag. Fragments carry only 1–3 keywords each (92-term controlled
  // vocabulary), so exact-match grouping is both cheaper and more legible than
  // Jaccard similarity over a near-empty set intersection would have been.
  const anyKeywords = allFragments().some(f=>f.keywords && f.keywords.length);
  if(opts.keywords && anyKeywords){
    groupAndLink((f)=>f.keywords||[], 'keyword', keywordLabel);
  }

  // degree is (re)computed by the caller once cross-era filtering (if any) has been applied
  return {nodes, links, anyKeywords};
}

    `<button class="guide-dot ${i===graphGuideStepIndex?'active':''}" data-goto-step="${i}" aria-label="Step ${i+1}: ${escapeHTML(s.label)}"></button>`
  ).join('');

  content.innerHTML = `
    <div class="guide-step-count">Step ${graphGuideStepIndex+1} of ${n}</div>
    <h2>${escapeHTML(step.label)}</h2>
    <div class="guide-step-body">${step.html}</div>
    <div class="guide-dots">${dots}</div>
    <div class="guide-nav-row">
      <button class="guide-nav-btn" id="guide-prev-btn" ${graphGuideStepIndex===0?'disabled':''}>&larr; Back</button>
      <button class="guide-nav-btn guide-nav-btn-primary" id="guide-next-btn">
        ${graphGuideStepIndex===n-1 ? 'Done' : 'Next →'}
      </button>
    </div>`;

  content.querySelectorAll('[data-goto-step]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ graphGuideStepIndex = +btn.getAttribute('data-goto-step'); renderGraphGuideStep(); });
  });
  document.getElementById('guide-prev-btn').addEventListener('click', ()=>{
    if(graphGuideStepIndex>0){ graphGuideStepIndex--; renderGraphGuideStep(); }
  });
  document.getElementById('guide-next-btn').addEventListener('click', ()=>{
    if(graphGuideStepIndex < n-1){ graphGuideStepIndex++; renderGraphGuideStep(); }
    else document.getElementById('graph-guide-overlay').classList.remove('open');
  });
}

function openGraphGuideOverlay(){
  graphGuideStepIndex = 0;
  renderGraphGuideStep();
  document.getElementById('graph-guide-overlay').classList.add('open');
  // Marked "seen" the moment it's shown, not only on close — otherwise navigating away
  // and back to Connections before dismissing it would keep popping the modal open again.
  try{ localStorage.setItem(GRAPH_GUIDE_SEEN_KEY, '1'); }catch(e){}
}

function wireGraphGuideOverlay(){
  const overlay = document.getElementById('graph-guide-overlay');
  const closeBtn = document.getElementById('graph-guide-close-btn');
  closeBtn.onclick = ()=> overlay.classList.remove('open');
  overlay.onclick = (e)=>{ if(e.target.id==='graph-guide-overlay') closeBtn.onclick(); };

  let alreadySeen = false;
  try{ alreadySeen = localStorage.getItem(GRAPH_GUIDE_SEEN_KEY) === '1'; }catch(e){}
  if(!alreadySeen) openGraphGuideOverlay();
}

function initGraph(){
  const wrap = document.getElementById('graph-canvas-wrap');
  if(!wrap) return;
  wrap.innerHTML = '';
  const width = wrap.clientWidth || 800;
  const height = wrap.clientHeight || 600;

  wireGraphGuideOverlay();

  const state = {
    sameAuthor:true, sameCompany:true, sameMyth:true, sameArticleMyth:true, sameTopic:true, sameSubtheme:true, sameRegister:true,
    sameMetaphor:true, sameArticle:true, keywords:true, crossEraOnly:false, compassMode:false
  };

  // Compass target for one fragment: the average position of the poles for every myth it
  // carries, or the canvas center if it carries none. Fragments with 2–3 myths (rare — 15 of
  // 473) land between their poles rather than snapping to just one, so "this node sits
  // between End of History and End of Politics" stays visually true to the coding.
  //
  // A fragment with no myth of its own but whose ARTICLE carries one (231 of 473 — nearly
  // half the corpus) still gets pulled toward that pole, but at a fraction of the radius
  // (INHERITED_PULL_FRACTION) — the article's mythic climate is a real but weaker force than
  // the fragment making the claim directly, so it should land noticeably closer to center,
  // not on the pole itself. Returns `inherited:true` in that case so the caller can style it
  // differently (see the fainter node outline in the tick/render code).
  const INHERITED_PULL_FRACTION = 0.4;

  // Deterministic per-fragment offset (same hash pattern as colorKeyword below), scattered
  // across a small disc rather than a single point. Without this, every fragment sharing
  // exactly one myth (90 fragments for End of History alone) targets the identical pixel —
  // no amount of repulsion competes cleanly against dozens of nodes all being pulled to one
  // point, so the cluster just compresses into a solid mass. Spreading the *targets*
  // themselves fixes it at the source instead of fighting it with stronger forces.
  const JITTER_RADIUS_FRACTION = 0.16;
  function jitterOffset(seedStr, maxR){
    let h1=0; for(let i=0;i<seedStr.length;i++) h1 = (h1*31 + seedStr.charCodeAt(i)) >>> 0;
    let h2=0; for(let i=0;i<seedStr.length;i++) h2 = (h2*37 + seedStr.charCodeAt(i) + 7) >>> 0;
    const angle = (h1 % 1000)/1000 * Math.PI*2;
    // sqrt so points distribute evenly across the disc's *area*, not bunched at the center
    const dist = Math.sqrt((h2 % 1000)/1000) * maxR;
    return { dx: Math.cos(angle)*dist, dy: Math.sin(angle)*dist };
  }

  function compassTarget(frag, art, cx, cy, radius){
    const ownMyths = getMyths(frag);
    let poles = ownMyths.map(m => MYTH_COMPASS[m.narrative]).filter(Boolean);
    let effectiveRadius = radius;
    let inherited = false;
    if(!poles.length){
      const articleMyths = getMyths(art);
      poles = articleMyths.map(m => MYTH_COMPASS[m.narrative]).filter(Boolean);
      if(poles.length){ inherited = true; effectiveRadius = radius * INHERITED_PULL_FRACTION; }
    }
    if(!poles.length) return {x:cx, y:cy, inherited:false};
    const sum = poles.reduce((acc,p)=>{
      const rad = p.angle * Math.PI/180;
      acc.x += Math.cos(rad); acc.y += Math.sin(rad);
      return acc;
    }, {x:0,y:0});
    const baseX = cx + (sum.x/poles.length)*effectiveRadius, baseY = cy + (sum.y/poles.length)*effectiveRadius;
    const j = jitterOffset(frag.id, radius*JITTER_RADIUS_FRACTION);
    return { x: baseX + j.dx, y: baseY + j.dy, inherited };
  }

  const svg = d3.select(wrap).append('svg').attr('viewBox',[0,0,width,height]);
  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.2,4]).on('zoom', (ev)=> g.attr('transform', ev.transform)));

  const tooltip = d3.select(wrap).append('div').attr('class','node-tooltip').style('display','none');
  const sidePanel = document.createElement('div');
  sidePanel.className = 'graph-side-panel';
  wrap.appendChild(sidePanel);

  const colorEra = y => y==='1999' ? getCSS('--amber') : getCSS('--turq');
  const colorReg = r => ({sublime:getCSS('--sublime'),demonic:getCSS('--demonic'),paired:getCSS('--paired'),deflated:getCSS('--deflated')}[r] || 'rgba(255,255,255,.25)');

  function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  // deterministic hue per keyword string, so the same keyword always renders the
  // same edge color across rebuilds/filters — not meant to be individually legible
  // against 92 possible hues, only to visually separate distinct keyword clusters.
  function colorKeyword(label){
    let h=0; for(let i=0;i<label.length;i++) h = (h*31 + label.charCodeAt(i)) >>> 0;
    return `hsl(${h%360},55%,62%)`;
  }

  let linkSel, nodeSel, simulation;
  let selection = null; // {mode:'node', nodeId} | {mode:'constellation', edgeType, edgeLabel} | null

  // Two highlight modes, one rendering path:
  //  - 'node'          → the clicked node + everything directly linked to it.
  //  - 'constellation' → the clicked *line*'s whole group: every link sharing that same
  //                      edge type+label (e.g. every "same author: Thomas L. Friedman" link),
  //                      plus every node any of those links touch. This is what makes a
  //                      single-line click show the whole cluster that line is a member of,
  //                      not just the one pair it happens to connect.
  // Recomputed from the *current* link selection each time, so it stays correct as edge-type
  // checkboxes add/remove links underneath a held selection instead of going stale.
  //
  // Perf note: with ~10k links, doing this as several separate D3 .classed(fn) passes was
  // measurably slow — each .classed() call re-evaluates its accessor per-element AND does
  // its own classList read/write, so three chained calls means three full DOM touches per
  // link. Below is one pass per selection that writes the whole class string in one go.
  let highlightRAF = null;
  function applyHighlight(){
    if(!nodeSel || !linkSel) return;
    if(highlightRAF) cancelAnimationFrame(highlightRAF);
    highlightRAF = requestAnimationFrame(()=>{
      highlightRAF = null;
      if(!selection){
        nodeSel.attr('class', null);
        linkSel.attr('class', null);
        return;
      }
      const activeNodeIds = new Set();
      const linkState = new Array(linkSel.size());
      linkSel.each(function(d,i){
        const sId = typeof d.source==='object' ? d.source.id : d.source;
        const tId = typeof d.target==='object' ? d.target.id : d.target;
        let touches;
        if(selection.mode==='node'){
          touches = sId===selection.nodeId || tId===selection.nodeId;
        } else {
          touches = d.type===selection.edgeType && d.label===selection.edgeLabel;
        }
        if(touches){ activeNodeIds.add(sId); activeNodeIds.add(tId); }
        linkState[i] = touches;
      });
      if(selection.mode==='node') activeNodeIds.add(selection.nodeId);
      nodeSel.attr('class', d =>
        (selection.mode==='node' && d.id===selection.nodeId) ? 'node-selected'
        : (activeNodeIds.has(d.id) ? null : 'dimmed'));
      linkSel.attr('class', (d,i) => linkState[i] ? 'link-active' : 'dimmed');
    });
  }

  function selectNode(id){
    selection = (selection && selection.mode==='node' && selection.nodeId===id) ? null : {mode:'node', nodeId:id};
    applyHighlight();
  }

  function selectConstellation(edgeType, edgeLabel){
    selection = (selection && selection.mode==='constellation' && selection.edgeType===edgeType && selection.edgeLabel===edgeLabel)
      ? null : {mode:'constellation', edgeType, edgeLabel};
    applyHighlight();
  }

  function build(){
    const data = buildGraphData({
      structural: {
        same_author: state.sameAuthor, same_company: state.sameCompany, same_myth: state.sameMyth,
        same_article_myth: state.sameArticleMyth,
        same_topic: state.sameTopic, same_subtheme: state.sameSubtheme, same_register: state.sameRegister,
        same_metaphor: state.sameMetaphor
      },
      sameArticle: state.sameArticle,
      keywords: state.keywords
    });
    document.getElementById('edge-keyword').disabled = !data.anyKeywords;
    document.getElementById('edge-keyword-label').classList.toggle('disabled', !data.anyKeywords);
    document.getElementById('keyword-hint').style.display = data.anyKeywords ? 'none' : 'block';
    const keywordOnlyBtn = document.querySelector('.edge-only-btn[data-only="edge-keyword"]');
    if(keywordOnlyBtn) keywordOnlyBtn.disabled = !data.anyKeywords;

    let links = data.links;
    const nodeById = {}; data.nodes.forEach(n=>nodeById[n.id]=n);
    if(state.crossEraOnly){
      links = links.filter(l=>{
        const s = nodeById[typeof l.source==='object'?l.source.id:l.source];
        const t = nodeById[typeof l.target==='object'?l.target.id:l.target];
        return s && t && s.year !== t.year;
      });
    }
    links.forEach(l=>{
      const s = nodeById[typeof l.source==='object'?l.source.id:l.source];
      const t = nodeById[typeof l.target==='object'?l.target.id:l.target];
      if(s) s.degree++; if(t) t.degree++;
    });

    g.selectAll('*').remove();
    if(simulation) simulation.stop();

    // Single source of truth for node radius, shared by the visible circle and the collide
    // force so they can never drift apart. Widened deliberately (2.5–17.5px, a 7x spread)
    // instead of the earlier 3–12px range — with ~470 nodes most of them cluster in a narrow
    // mid-degree band, so a subtler scale reads as "everything's the same size" even though
    // the underlying degree count really does vary node to node.
    const nodeRadius = d => 2.5 + Math.min(15, d.degree*0.9);

    // Compass mode: each node's forceX/forceY target is precomputed once per build() (not
    // per tick — the myth composition of a fragment never changes mid-simulation), then a
    // positional force pulls toward it. Left attached but at strength 0 when compass mode is
    // off, rather than added/removed from the simulation, so toggling the checkbox doesn't
    // need to rebuild the whole force list — just flip the strength and reheat.
    const compassRadius = Math.min(width,height) * 0.34;
    data.nodes.forEach(n=>{
      const t = compassTarget(n.frag, n.article, width/2, height/2, compassRadius);
      n.compassX = t.x; n.compassY = t.y; n.compassInherited = t.inherited;
    });

    // Faint crosshair only — drawn here (right after g.selectAll('*').remove() above, and
    // after compassRadius exists) so it survives the clear and sits behind everything added
    // afterward. The pole *text* labels are handled separately, after nodeSel, so they can
    // render on top of the node clusters that pile up around each pole (see below).
    if(state.compassMode){
      const axisR = compassRadius + 10;
      const compassAxisG = g.append('g').attr('class','compass-guides');
      compassAxisG.append('line').attr('class','compass-axis')
        .attr('x1', width/2 - axisR).attr('x2', width/2 + axisR)
        .attr('y1', height/2).attr('y2', height/2);
      compassAxisG.append('line').attr('class','compass-axis')
        .attr('x1', width/2).attr('x2', width/2)
        .attr('y1', height/2 - axisR).attr('y2', height/2 + axisR);
    }

    // With compass targets now jittered across a small disc (see jitterOffset above) instead
    // of every same-pole node aiming at one identical pixel, physics no longer has to fight a
    // structural collision — repulsion here is back closer to the free-layout value, just
    // slightly softer so the compass force still visibly wins the shape of the layout.
    simulation = d3.forceSimulation(data.nodes)
      .force('link', d3.forceLink(links).id(d=>d.id).distance(70).strength(state.compassMode?0.015:0.04))
      .force('charge', d3.forceManyBody().strength(state.compassMode?-90:-160).distanceMax(400))
      .force('center', d3.forceCenter(width/2, height/2).strength(state.compassMode?0.02:1))
      .force('collide', d3.forceCollide(d=>nodeRadius(d)+(state.compassMode?2:1)))
      .force('compassX', d3.forceX(d=>d.compassX).strength(state.compassMode?0.25:0))
      .force('compassY', d3.forceY(d=>d.compassY).strength(state.compassMode?0.25:0))
      .alphaDecay(0.02);

    // Each edge is actually two overlaid <line>s: a fat, fully transparent one that only
    // exists to give the mouse a bigger, easier target (SVG hit-testing follows the stroke
    // itself, so a 0.6px line is nearly impossible to click precisely), and the thin visible
    // one on top for the actual drawing. Interaction listeners live on the invisible hit
    // layer; linkSel (used by tick/highlight) stays pointed at the visible layer.
    const linkGroup = g.append('g').attr('stroke-opacity',0.35);
    const linkHitSel = linkGroup.selectAll('line.link-hit')
      .data(links).join('line')
      .attr('class','link-hit')
      .attr('stroke','transparent')
      .attr('stroke-width', 14)
      .style('cursor', d=>d.label?'pointer':'default')
      .on('mouseenter', (ev,d)=>{
        if(!d.label) return;
        const [px,py] = d3.pointer(ev, wrap);
        tooltip.style('display','block')
          .style('left',(px+12)+'px').style('top',(py+8)+'px')
          .html(`<b>${escapeHTML(EDGE_TYPE_LABELS[d.type]||d.type)}</b><br>${escapeHTML(d.label)}`);
      })
      .on('mousemove', (ev)=>{ const [px,py] = d3.pointer(ev, wrap); tooltip.style('left',(px+12)+'px').style('top',(py+8)+'px'); })
      .on('mouseleave', ()=> tooltip.style('display','none'))
      .on('click', (ev,d)=>{
        if(!d.label) return;
        ev.stopPropagation();
        selectConstellation(d.type, d.label);
        const memberIds = new Set();
        links.forEach(l=>{
          if(l.type!==d.type || l.label!==d.label) return;
          memberIds.add(typeof l.source==='object' ? l.source.id : l.source);
          memberIds.add(typeof l.target==='object' ? l.target.id : l.target);
        });
        const nodesInGroup = Array.from(memberIds).map(id=>nodeById[id]).filter(Boolean);
        openConstellationSidePanel(nodesInGroup, d.type, d.label, sidePanel);
      });

    linkSel = linkGroup.selectAll('line.link-visible')
      .data(links).join('line')
      .attr('class','link-visible')
      .attr('stroke', d=> d.type==='keyword' ? colorKeyword(d.label||'') : (EDGE_TYPE_COLORS[d.type] || '#3a3850'))
      .attr('stroke-width', d=> d.type==='same_article' ? 1.2 : (d.type==='keyword' ? 1 : 0.6))
      .style('pointer-events','none');

    nodeSel = g.append('g').selectAll('circle')
      .data(data.nodes).join('circle')
      .attr('r', nodeRadius)
      .attr('fill', d=>colorEra(d.year))
      .attr('stroke', d=>d.register ? colorReg(d.register) : (state.compassMode && d.compassInherited ? getCSS('--ink-faint') : 'none'))
      .attr('stroke-width', d=>d.register ? 2 : (state.compassMode && d.compassInherited ? 1.2 : 0))
      // Dashed outline = pulled by an inherited article myth rather than the fragment's own
      // register/myth — only meaningful while compass mode is on, so it's a no-op otherwise.
      .attr('stroke-dasharray', d=> state.compassMode && d.compassInherited ? '2,2' : null)
      .attr('tabindex', 0)
      .style('cursor','pointer')
      .on('mouseenter', (ev,d)=>{
        const [px,py] = d3.pointer(ev, wrap);
        tooltip.style('display','block')
          .style('left',(px+12)+'px').style('top',(py+8)+'px')
          .html(`<b>${escapeHTML(d.frag.primary_subject||d.frag.id)}</b><br>${d.year||''} &middot; ${d.degree} links`);
      })
      .on('mousemove', (ev)=>{ const [px,py] = d3.pointer(ev, wrap); tooltip.style('left',(px+12)+'px').style('top',(py+8)+'px'); })
      .on('mouseleave', ()=> tooltip.style('display','none'))
      .on('click', (ev,d)=>{ ev.stopPropagation(); selectNode(d.id); openGraphSidePanel(d, sidePanel); })
      .on('keypress', (ev,d)=>{ if(ev.key==='Enter'){ selectNode(d.id); openGraphSidePanel(d, sidePanel); } });

    // Pole text labels — added to `g` LAST (after nodeSel), so SVG's paint order puts them
    // above every node, no matter how densely a cluster piles up around a pole. Earlier
    // versions drew these before the nodes and relied on distance + a backing rect to stay
    // legible, but node clusters routinely grew wider than that margin and swallowed the
    // text anyway; paint order is the only thing that actually guarantees visibility.
    if(state.compassMode){
      const labelR = compassRadius + 60;
      const compassLabelG = g.append('g').attr('class','compass-guides');
      Object.values(MYTH_COMPASS).forEach(p=>{
        const rad = p.angle * Math.PI/180;
        const lx = width/2 + Math.cos(rad)*labelR, ly = height/2 + Math.sin(rad)*labelR;
        const text = `${p.pole} · ${p.label}`;
        compassLabelG.append('rect').attr('class','compass-label-bg')
          .attr('x', lx - text.length*3.2 - 6).attr('y', ly - 9)
          .attr('width', text.length*6.4 + 12).attr('height', 18);
        compassLabelG.append('text').attr('class','compass-label')
          .attr('x', lx).attr('y', ly)
          .attr('text-anchor','middle').attr('dominant-baseline','middle')
          .text(text);
      });
      const centerText = 'no myth coded';
      const centerY = height/2 - 18;
      compassLabelG.append('rect').attr('class','compass-label-bg')
        .attr('x', width/2 - centerText.length*2.7 - 5).attr('y', centerY - 7)
        .attr('width', centerText.length*5.4 + 10).attr('height', 14);
      compassLabelG.append('text').attr('class','compass-label compass-label-center')
        .attr('x', width/2).attr('y', centerY)
        .attr('text-anchor','middle').attr('dominant-baseline','middle')
        .text(centerText);
    }

    simulation.on('tick', ()=>{
      linkHitSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeSel.attr('cx',d=>d.x).attr('cy',d=>d.y);
    });

    applyHighlight();
  }

  build();

  // Clicking empty canvas (not a node) clears the neighborhood highlight.
  svg.on('click', ()=>{ selection = null; applyHighlight(); });

  const EDGE_CHECKBOX_STATE_KEYS = {
    'edge-same-article':'sameArticle', 'edge-same-author':'sameAuthor', 'edge-same-company':'sameCompany',
    'edge-same-myth':'sameMyth', 'edge-same-article-myth':'sameArticleMyth', 'edge-same-topic':'sameTopic', 'edge-same-subtheme':'sameSubtheme',
    'edge-same-register':'sameRegister', 'edge-same-metaphor':'sameMetaphor', 'edge-keyword':'keywords'
  };
  const edgeCheckboxIds = Object.keys(EDGE_CHECKBOX_STATE_KEYS);
  edgeCheckboxIds.forEach(id=>{
    document.getElementById(id).addEventListener('change', e=>{
      state[EDGE_CHECKBOX_STATE_KEYS[id]] = e.target.checked;
      build();
    });
  });
  document.getElementById('edge-select-all').addEventListener('click', ()=>{
    edgeCheckboxIds.forEach(id=>{
      const el = document.getElementById(id);
      if(el.disabled) return;
      el.checked = true;
      state[EDGE_CHECKBOX_STATE_KEYS[id]] = true;
    });
    build();
  });
  document.getElementById('edge-select-none').addEventListener('click', ()=>{
    edgeCheckboxIds.forEach(id=>{
      const el = document.getElementById(id);
      if(el.disabled) return;
      el.checked = false;
      state[EDGE_CHECKBOX_STATE_KEYS[id]] = false;
    });
    build();
  });
  document.getElementById('cross-era-only').addEventListener('change', e=>{ state.crossEraOnly=e.target.checked; build(); });
  document.getElementById('compass-mode').addEventListener('change', e=>{ state.compassMode=e.target.checked; build(); });

  // "only" isolates one edge dimension in a single click — turns every other checkbox off
  // and the clicked one on, instead of requiring "select none" + manually re-checking one.
  document.querySelectorAll('.edge-only-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const targetId = btn.getAttribute('data-only');
      edgeCheckboxIds.forEach(id=>{
        const el = document.getElementById(id);
        if(el.disabled) return;
        const shouldBeOn = id===targetId;
        el.checked = shouldBeOn;
        state[EDGE_CHECKBOX_STATE_KEYS[id]] = shouldBeOn;
      });
      build();
    });
  });
}

function openGraphSidePanel(d, panel){
  panel.innerHTML = `<button class="overlay-close" id="graph-panel-close" style="position:static;float:right;">&times;</button>`
    + fragmentCardHTML(d.frag);
  wireFragmentCardInteractions(panel);
  panel.classList.add('open');
  panel.querySelector('#graph-panel-close').addEventListener('click', ()=> panel.classList.remove('open'));
}

// A clicked line opens its whole constellation as a list of member fragments (rather than
// one fragment card) — clicking a member drills into that fragment's own detail card.
function openConstellationSidePanel(nodesInGroup, edgeType, edgeLabel, panel){
  const rows = nodesInGroup.map(n => `<div class="constellation-row" data-frag-id="${escapeHTML(n.id)}">
      <span class="era-dot" style="background:${n.year==='1999'?'var(--amber)':'var(--turq)'}"></span>
      <span class="row-text">${escapeHTML(n.frag.primary_subject || (n.frag.quotation||'').slice(0,70))}</span>
    </div>`).join('');
  panel.innerHTML = `<button class="overlay-close" id="graph-panel-close" style="position:static;float:right;">&times;</button>
    <div class="constellation-head">
      <div class="m-eyebrow">${escapeHTML(EDGE_TYPE_LABELS[edgeType]||edgeType)}</div>
      <h3>${escapeHTML(edgeLabel)}</h3>
      <p class="pending">${nodesInGroup.length} fragment${nodesInGroup.length===1?'':'s'} in this constellation</p>
    </div>
    <div class="constellation-list">${rows}</div>`;
  panel.classList.add('open');
  panel.querySelector('#graph-panel-close').addEventListener('click', ()=> panel.classList.remove('open'));
  panel.querySelectorAll('[data-frag-id]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const n = nodesInGroup.find(x=>x.id===row.getAttribute('data-frag-id'));
      if(n) openGraphSidePanel(n, panel);
    });
  });
}

/* =========================================================================
   9. ROUTER
   ========================================================================= */
function navigateTo(view, params){
  params = params || {};
  if(view === 'article') location.hash = '#article/'+params.id;
  else if(view === 'evidence') location.hash = '#evidence';
  else location.hash = '#'+view;
}

function currentRoute(){
  const h = location.hash.replace(/^#/, '');
  if(h.startsWith('article/')) return {view:'article', id:h.split('/')[1]};
  if(h.startsWith('evidence')) return {view:'evidence'};
  if(h.startsWith('graph')) return {view:'graph'};
  if(h.startsWith('method')) return {view:'method'};
  return {view:'biography'};
}

function setActiveNav(view){
  document.querySelectorAll('#topnav nav button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-view')===view);
  });
}

function render(){
  const route = currentRoute();
  const app = document.getElementById('app');
  setActiveNav(route.view === 'article' ? 'evidence' : route.view);

  if(route.view === 'biography'){
    app.innerHTML = renderBiography();
    wireBubbleIntro(app);
    wireFragmentCardInteractions(app);
    wireChapterScroll(app);
    requestAnimationFrame(wireMetaphorDecks);
    wireScrollReveal(app);
  } else if(route.view === 'evidence'){
    parseFiltersFromURL();
    app.innerHTML = renderEvidence();
    wireEvidenceFilters();
    renderEvidenceResults();
  } else if(route.view === 'article'){
    app.innerHTML = renderArticlePage(route.id);
    wireFragmentCardInteractions(app);
    const back = document.getElementById('back-to-evidence');
    if(back) back.addEventListener('click', (e)=>{ e.preventDefault(); location.hash='#evidence'; });
  } else if(route.view === 'graph'){
    app.innerHTML = renderGraph();
    requestAnimationFrame(initGraph);
  } else if(route.view === 'method'){
    app.innerHTML = renderMethod();
  }
  window.scrollTo(0,0);
}

/* =========================================================================
   10. INIT
   ========================================================================= */
function init(){
  renderStatusFooter();
  document.querySelectorAll('#topnav nav button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = btn.getAttribute('data-view');
      location.hash = v === 'biography' ? '' : '#'+v;
    });
  });
  window.addEventListener('hashchange', render);
  render();
}

boot();
</script>
</body>
</html>
